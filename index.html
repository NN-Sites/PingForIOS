    }
    .tile__check svg { width: 14px; height: 14px; }
    .tile[aria-pressed="true"] .tile__check { display: flex; }
    .tile__title { font-size: 14px; font-weight: 700; }
    .tile__sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* Empty states ------------------------------------------------------------ */
    .empty {
        display: flex; flex-direction: column; align-items: center; text-align: center;
        padding: 32px 20px;
        color: var(--muted);
    }
    .empty__icon {
        width: 56px; height: 56px; border-radius: 18px;
        background: var(--brand-soft); color: var(--brand-ink);
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 14px;
    }
    .empty__icon svg { width: 28px; height: 28px; }
    .empty__title { font-size: 16px; font-weight: 700; color: var(--ink); }
    .empty__text { font-size: 14px; margin-top: 4px; max-width: 280px; line-height: 1.5; }

    /* Skeleton */
    .skeleton {
        background: linear-gradient(90deg, #EFEBE3 25%, #F7F4EE 50%, #EFEBE3 75%);
        background-size: 200% 100%;
        animation: ping-shimmer 1.2s infinite;
        border-radius: 8px;
    }
    @keyframes ping-shimmer { to { background-position: -200% 0; } }

    /* Modals & sheets ---------------------------------------------------------- */
    .modal {
        position: fixed; inset: 0; z-index: 60;
        display: none;
        align-items: flex-end; justify-content: center;
        padding: 0;
        background: rgba(28, 25, 23, .45);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }
    .modal.is-open { display: flex; animation: ping-fade .2s ease; }
    .modal__panel {
        width: 100%; max-width: 440px;
        max-height: calc(100dvh - 40px);
        overflow-y: auto;
        background: var(--surface);
        border-radius: 28px 28px 0 0;
        padding: 12px 20px calc(20px + var(--safe-bottom));
        box-shadow: var(--shadow-lg);
        animation: ping-sheet-up .28s cubic-bezier(.2, .9, .3, 1.05);
        box-sizing: border-box;
    }
    .modal__grabber { width: 40px; height: 5px; border-radius: 999px; background: #E2DDD2; margin: 0 auto 12px; }
    .modal__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .modal__title { font-size: 19px; font-weight: 800; margin: 0; }
    .modal__text { font-size: 14.5px; color: var(--ink-2); line-height: 1.6; margin: 0; }
    .modal__actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal__actions .btn { flex: 1; }
    .modal__hero {
        width: 64px; height: 64px; border-radius: 20px;
        display: flex; align-items: center; justify-content: center;
        margin: 4px auto 14px;
        background: var(--brand-soft); color: var(--brand-ink);
    }
    .modal__hero svg { width: 30px; height: 30px; }
    .modal__hero--danger { background: var(--danger-soft); color: var(--danger); }

    @media (min-width: 640px) {
        .modal { align-items: center; padding: 20px; }
        .modal__panel { border-radius: 28px; padding: 20px 24px 24px; animation: ping-pop .22s cubic-bezier(.2, .9, .3, 1.1); }
        .modal__grabber { display: none; }
    }

    @keyframes ping-fade { from { opacity: 0; } }
    @keyframes ping-sheet-up { from { transform: translateY(40px); opacity: .4; } }
    @keyframes ping-pop { from { transform: scale(.94); opacity: 0; } }

    /* Toasts ------------------------------------------------------------------ */
    .toast-region {
        position: fixed; z-index: 80;
        top: calc(var(--safe-top) + 12px);
        left: 12px; right: 12px;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        pointer-events: none;
    }
    .toast {
        pointer-events: auto;
        display: flex; align-items: center; gap: 10px;
        max-width: 420px; width: max-content;
        padding: 10px 14px 10px 12px;
        border-radius: 16px;
        background: var(--ink); color: #fff;
        font-size: 14px; font-weight: 500;
        box-shadow: var(--shadow-lg);
        animation: ping-toast-in .3s cubic-bezier(.2, .9, .3, 1.2);
    }
    .toast.is-leaving { animation: ping-toast-out .2s ease forwards; }
    .toast__icon {
        width: 24px; height: 24px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        background: rgba(255,255,255,.14);
    }
    .toast__icon svg { width: 15px; height: 15px; }
    .toast--success .toast__icon { background: #10B981; }
    .toast--error .toast__icon { background: #F43F5E; }
    .toast--points .toast__icon { background: var(--brand); color: var(--ink); }
    .toast__action {
        margin-inline-start: 6px;
        background: none; border: 0; padding: 4px 6px; border-radius: 8px;
        color: var(--brand); font: inherit; font-weight: 700; cursor: pointer; text-decoration: none;
    }
    .toast__action:hover { background: rgba(255,255,255,.1); }
    @keyframes ping-toast-in { from { transform: translateY(-16px) scale(.96); opacity: 0; } }
    @keyframes ping-toast-out { to { transform: translateY(-10px); opacity: 0; } }

    /* Utilities --------------------------------------------------------------- */
    .fade-in { animation: ping-fade-up .3s ease both; }
    @keyframes ping-fade-up { from { opacity: 0; transform: translateY(6px); } }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .scroll-x { overflow-x: auto; scrollbar-width: none; }
    .scroll-x::-webkit-scrollbar { display: none; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #DDD7CB; border-radius: 8px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ---------- Friend-request popup (top of screen) ---------- */
    .req-banners {
        position: fixed; z-index: 85; top: calc(var(--safe-top) + 10px); left: 10px; right: 10px;
        display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
    }
    .req-banner {
        pointer-events: auto; width: 100%; max-width: 420px; box-sizing: border-box;
        display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px;
        background: rgba(255,255,255,.97); border: 1px solid var(--border); border-radius: 22px;
        box-shadow: 0 18px 40px -12px rgba(28,25,23,.35), 0 2px 6px rgba(28,25,23,.08);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        animation: req-in .5s cubic-bezier(.2, 1.3, .4, 1) both; touch-action: pan-y;
    }
    .req-banner.is-leaving { animation: req-out .28s ease forwards; }
    @keyframes req-in { from { transform: translateY(-130%) scale(.96); opacity: 0; } }
    @keyframes req-out { to { transform: translateY(-120%); opacity: 0; } }
    .req-banner__body { flex: 1; min-width: 0; line-height: 1.3; }
    .req-banner__title { font-weight: 800; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .req-banner__sub { font-size: 12.5px; color: var(--muted); }
    .req-btn {
        width: 42px; height: 42px; border-radius: 50%; border: 0; flex-shrink: 0; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center;
        transition: transform .1s ease, background-color .15s ease;
    }
    .req-btn:active { transform: scale(.9); }
    .req-btn svg { width: 20px; height: 20px; }
    .req-btn--yes { background: #10B981; color: #fff; box-shadow: 0 6px 14px -6px rgba(16,185,129,.7); }
    .req-btn--yes:hover { background: #059669; }
    .req-btn--no { background: var(--surface-2); color: var(--ink-2); }
    .req-btn--no:hover { background: #ECE8DE; }
    .req-btn.is-loading::after { border-color: rgba(255,255,255,.35); border-top-color: #fff; }
    .req-banner__bar { position: absolute; }

    /* ---------- Splash screen (2s, once per app session) ---------- */
    html.ping-splashing { background: #FFC400; }
    html.ping-splashing body { overflow: hidden; }
    html.ping-splashing body > :not(.splash) { opacity: 0; }
    .splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(circle at 50% 42%, #FFD95A 0%, #FFC400 55%, #F5B000 100%);
        color: #fff; overflow: hidden;
    }
    .splash.is-leaving { animation: splash-out .38s cubic-bezier(.4, 0, .2, 1) forwards; }
    @keyframes splash-out { to { opacity: 0; transform: scale(1.08); } }
    .splash__stage { position: relative; width: 132px; height: 132px; display: flex; align-items: center; justify-content: center; }
    .splash__ring {
        position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(255,255,255,.75);
        opacity: 0; animation: splash-ring 1.6s cubic-bezier(.2, .6, .3, 1) infinite;
    }
    .splash__ring:nth-child(2) { animation-delay: .45s; }
    .splash__ring:nth-child(3) { animation-delay: .9s; }
    @keyframes splash-ring { 0% { transform: scale(.55); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }
    .splash__logo { width: 112px; height: 112px; animation: splash-pop .6s cubic-bezier(.2, 1.5, .4, 1) both; filter: drop-shadow(0 10px 24px rgba(160, 100, 0, .35)); }
    @keyframes splash-pop { from { transform: scale(.3) rotate(-25deg); opacity: 0; } }
    .splash__logo path { stroke-dasharray: 130; stroke-dashoffset: 130; animation: splash-draw .7s ease forwards; }
    .splash__logo path:nth-of-type(2) { animation-delay: .12s; }
    .splash__logo path:nth-of-type(3) { animation-delay: .24s; }
    .splash__logo path:nth-of-type(4) { animation-delay: .36s; }
    .splash__logo circle { transform-origin: 28px 32px; animation: splash-dot .5s .1s cubic-bezier(.2, 1.6, .4, 1) both; }
    @keyframes splash-draw { to { stroke-dashoffset: 0; } }
    @keyframes splash-dot { from { transform: scale(0); } }
    .splash__word { font-size: 44px; font-weight: 900; letter-spacing: -.02em; line-height: 1; text-shadow: 0 4px 16px rgba(160, 100, 0, .3); }
    .splash__word span { display: inline-block; animation: splash-letter .5s cubic-bezier(.2, 1.4, .4, 1) both; }
    .splash__word span:nth-child(1) { animation-delay: .55s; }
    .splash__word span:nth-child(2) { animation-delay: .62s; }
    .splash__word span:nth-child(3) { animation-delay: .69s; }
    .splash__word span:nth-child(4) { animation-delay: .76s; }
    @keyframes splash-letter { from { transform: translateY(24px); opacity: 0; } }
    .splash__tag { font-size: 15px; font-weight: 600; color: rgba(255,255,255,.92); animation: ping-fade-up .5s 1s ease both; }

    /* ---------- App-wide motion ---------- */
    .app-header { animation: anim-header .45s cubic-bezier(.2, .8, .3, 1) both; }
    @keyframes anim-header { from { transform: translateY(-12px); opacity: 0; } }
    .bottom-nav { animation: anim-nav .45s cubic-bezier(.2, .8, .3, 1) both; }
    @keyframes anim-nav { from { transform: translateY(16px); opacity: 0; } }
    .app-content > *, .feed > .post, .messages > .empty { animation: ping-fade-up .45s cubic-bezier(.2, .8, .3, 1) both; }
    .app-content > :nth-child(2) { animation-delay: .05s; }
    .app-content > :nth-child(3) { animation-delay: .1s; }
    .app-content > :nth-child(4) { animation-delay: .15s; }
    .app-content > :nth-child(5) { animation-delay: .2s; }
    .app-content > :nth-child(n+6) { animation-delay: .25s; }
    .grid > .tile { animation: ping-fade-up .4s cubic-bezier(.2, .8, .3, 1) both; }
    .grid > .tile:nth-child(2) { animation-delay: .04s; }
    .grid > .tile:nth-child(3) { animation-delay: .08s; }
    .grid > .tile:nth-child(4) { animation-delay: .12s; }
    .grid > .tile:nth-child(n+5) { animation-delay: .16s; }

    .nav-item[aria-current="page"] .nav-item__icon { animation: nav-pop .45s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes nav-pop { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
    .card { transition: transform .18s ease, box-shadow .18s ease; }
    a.card:active, button.card:active, a.tile:active, button.tile:active { transform: scale(.98); }
    .empty__icon { animation: empty-float 3s ease-in-out infinite; }
    @keyframes empty-float { 50% { transform: translateY(-5px); } }
    .avatar[class*="frame_"] { animation: frame-glow 2.6s ease-in-out infinite; }
    @keyframes frame-glow { 50% { filter: brightness(1.12) saturate(1.25); } }
    .modal.is-open .modal__panel > * { animation: ping-fade-up .3s .05s ease both; }

    /* entry animations wait for the splash, and play only on first load (not on every re-render) */
    html.ping-splashing .app-header, html.ping-splashing .bottom-nav, html.ping-splashing .app-content > *,
    html.ping-splashing .feed > .post, html.ping-splashing .grid > .tile { animation-play-state: paused; }
    body.anim-settled .app-content > *, body.anim-settled .feed > .post:not(.fade-in),
    body.anim-settled .grid > .tile, body.anim-settled .messages > .empty { animation: none; }

    body.page-leave .app-main, body.page-leave .app-header__title { animation: page-leave .16s ease forwards; }
    @keyframes page-leave { to { opacity: 0; transform: translateY(6px); } }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    </style>

    <style>
        #map { position: absolute; inset: 0; background: #EEF0EC; z-index: 0; }
        .leaflet-tile-pane { filter: saturate(.55) contrast(.95) brightness(1.04); }
        .leaflet-control-attribution { font-size: 10px; background: rgba(255,255,255,.7) !important; border-radius: 8px 0 0 0; }
        .leaflet-popup-content-wrapper { border-radius: 16px; box-shadow: var(--shadow-md); font-family: inherit; }
        .leaflet-popup-content { margin: 12px 14px; font-family: 'Heebo', sans-serif; }
        .leaflet-popup-tip { box-shadow: none; }
        .leaflet-container a.leaflet-popup-close-button { top: 6px; left: 6px; right: auto; }

        .map-pin { position: relative; width: 48px; height: 48px; }
        .map-pin .avatar { width: 44px; height: 44px; font-size: 17px; border: 3px solid #fff; box-shadow: var(--shadow-md); position: absolute; top: 2px; left: 2px; box-sizing: border-box; }
        /* Purchased frames: the pin's own shadow must not override the frame glow */
        .map-pin .avatar.frame_gold, .map-pin .avatar.frame_neon, .map-pin .avatar.frame_fire, .map-pin .avatar.frame_purple { border-width: 0; width: 40px; height: 40px; top: 4px; left: 4px; }
        .map-pin .avatar.frame_gold { box-shadow: 0 0 0 3px #fff, 0 0 0 6px #F5B700, 0 0 16px 5px rgba(245, 183, 0, .7), var(--shadow-md); }
        .map-pin .avatar.frame_neon { box-shadow: 0 0 0 3px #fff, 0 0 0 6px #3B82F6, 0 0 16px 5px rgba(59, 130, 246, .7), var(--shadow-md); }
        .map-pin .avatar.frame_fire { box-shadow: 0 0 0 3px #fff, 0 0 0 6px #EF4444, 0 0 16px 5px rgba(239, 68, 68, .7), var(--shadow-md); }
        .map-pin .avatar.frame_purple { box-shadow: 0 0 0 3px #fff, 0 0 0 6px #A855F7, 0 0 16px 5px rgba(168, 85, 247, .7), var(--shadow-md); }
        .map-pin .avatar[class*="frame_"] { animation: frame-glow 2.6s ease-in-out infinite; }
        @keyframes frame-glow { 50% { filter: brightness(1.12) saturate(1.2); } }
        .map-pin { animation: pin-drop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
        @keyframes pin-drop { from { transform: translateY(-18px) scale(.6); opacity: 0; } }
        .map-pin--friend .avatar:not(:has(img)) { background: linear-gradient(135deg, #93C5FD, #3B82F6); color: #fff; }
        .map-pin--me::before, .map-pin--me::after {
            content: ""; position: absolute; inset: -6px; border-radius: 50%;
            background: rgba(255, 196, 0, .35); animation: me-pulse 2.4s ease-out infinite;
        }
        .map-pin--me::after { animation-delay: 1.2s; }
        @keyframes me-pulse { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }

        .map-overlay { position: absolute; z-index: 500; pointer-events: none; }
        .map-overlay > * { pointer-events: auto; }
        .floating { background: rgba(255,255,255,.95); backdrop-filter: blur(12px); border: 1px solid var(--border); box-shadow: var(--shadow-md); }

        .share-fab { min-height: 54px; padding: 0 22px; border-radius: 18px; font-size: 15px; box-shadow: var(--shadow-md); }
        .share-fab[aria-pressed="true"] { background: var(--ink); color: #fff; }
        .live-dot { width: 9px; height: 9px; border-radius: 50%; background: #22C55E; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: live 1.8s infinite; }
        @keyframes live { 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
    </style>
</head>
<body>
<div class="app">

    <header class="app-header">
        <div class="app-header__title">
            <div data-ping-logo></div>
            <div>
                <h1>Ping</h1>
                <p id="header-sub">גלו מה קורה מסביבכם</p>
            </div>
        </div>
        <div class="app-header__actions">
            <a href="shop.html" id="points-chip" class="points-chip hidden" title="הנקודות שלך">
                <span class="coin">P</span><span data-points>0</span>
            </a>
            <a href="profile.html" id="me-avatar" class="hidden" aria-label="הפרופיל שלי"></a>
            <a href="auth.html" id="login-btn" class="btn btn-primary btn-sm hidden">התחברות</a>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden">
        <div id="map" role="application" aria-label="מפת חברים"></div>

        <!-- Top overlay: friends summary / logged-out hint -->
        <div class="map-overlay top-3 inset-x-3 flex justify-center">
            <button id="friends-pill" type="button" class="floating hidden rounded-full h-10 px-4 items-center gap-2 text-sm font-semibold text-ink" onclick="fitToFriends()">
                <span data-icon="users" class="w-4 h-4 inline-flex"></span>
                <span id="friends-pill-text">אין חברים על המפה</span>
            </button>
            <a id="guest-pill" href="auth.html" class="floating hidden rounded-full h-10 px-4 items-center gap-2 text-sm font-semibold text-ink">
                <span>התחברו כדי לראות את החברים שלכם</span>
                <span class="text-brand-700 font-bold">←</span>
            </a>
        </div>

        <!-- Map controls -->
        <div class="map-overlay bottom-4 inset-x-4 flex items-end justify-between gap-3">
            <button id="share-btn" type="button" aria-pressed="false" class="btn btn-primary share-fab hidden" onclick="toggleShareLocation()">
                <span id="share-btn-icon" class="inline-flex"></span>
                <span id="share-btn-text">שתפו מיקום</span>
            </button>
            <span class="flex-1"></span>
            <div class="flex flex-col gap-2">
                <button type="button" class="icon-btn floating !w-12 !h-12 !rounded-2xl !bg-white" onclick="window.map.zoomIn()" aria-label="התקרב">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button type="button" class="icon-btn floating !w-12 !h-12 !rounded-2xl !bg-white" onclick="window.map.zoomOut()" aria-label="התרחק">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>
                </button>
                <button id="locate-btn" type="button" class="icon-btn floating !w-12 !h-12 !rounded-2xl !bg-white" onclick="recenterMap()" aria-label="מרכז למיקום שלי" data-icon="locate"></button>
            </div>
        </div>
    </main>

    <nav data-ping-nav="home"></nav>
</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Map setup (Tel Aviv until we know where the user is)
        const DEFAULT_COORDS = [32.0853, 34.7818];
        window.map = L.map('map', { zoomControl: false, attributionControl: true }).setView(DEFAULT_COORDS, 14);
        window.map.attributionControl.setPrefix(false);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(window.map);

        window.lastKnownPosition = null;
        let meMarker = null;
        let hasCenteredOnUser = false;

        function pinIcon(html, variant) {
            return L.divIcon({
                className: '',
                html: `<div class="map-pin map-pin--${variant}">${html}</div>`,
                iconSize: [48, 48],
                iconAnchor: [24, 24],
                popupAnchor: [0, -22]
            });
        }
        window.pinIcon = pinIcon;

        window.updateUserMarker = function(coords, profile) {
            window.lastKnownPosition = coords;
            const html = PingUI.avatarHTML({ photoURL: profile?.photoURL, name: profile?.displayName || profile?.username, frame: profile?.activeFrame });
            if (!meMarker) {
                meMarker = L.marker(coords, { icon: pinIcon(html, 'me'), zIndexOffset: 1000 })
                    .addTo(window.map)
                    .bindPopup('<b>את/ה כאן</b>');
                meMarker._pingHtml = html;
            } else {
                meMarker.setLatLng(coords);
                if (meMarker._pingHtml !== html) { meMarker.setIcon(pinIcon(html, 'me')); meMarker._pingHtml = html; }
            }
            if (!hasCenteredOnUser) {
                hasCenteredOnUser = true;
                window.map.flyTo(coords, 15, { duration: .8 });
            }
        };

        window.removeUserMarker = function() {
            if (meMarker) { window.map.removeLayer(meMarker); meMarker = null; }
        };

        function recenterMap() {
            const btn = document.getElementById('locate-btn');
            if (window.lastKnownPosition) {
                window.map.flyTo(window.lastKnownPosition, 16, { duration: .8 });
                return;
            }
            if (!navigator.geolocation) {
                PingUI.toast('הדפדפן לא תומך באיתור מיקום', { type: 'error' });
                return;
            }
            PingUI.setLoading(btn, true);
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    PingUI.setLoading(btn, false);
                    const coords = [pos.coords.latitude, pos.coords.longitude];
                    window.updateUserMarker(coords, window.getUserData?.());
                    window.map.flyTo(coords, 16, { duration: .8 });
                },
                (err) => {
                    PingUI.setLoading(btn, false);
                    PingUI.toast(err.code === 1 ? 'אין הרשאת מיקום. אפשרו אותה בהגדרות הדפדפן' : 'לא הצלחנו למצוא את המיקום שלכם', { type: 'error' });
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
            );
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import * as firestoreAll from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_qQYXimsvfpHx2Ewub5zgNC2169Da7CM",
            authDomain: "ping-35cba.firebaseapp.com",
            projectId: "ping-35cba",
            storageBucket: "ping-35cba.firebasestorage.app",
            messagingSenderId: "73779940449",
            appId: "1:73779940449:web:281f72743f38a0a6816e20",
            measurementId: "G-KVVDK019JN"
        };

        const app = initializeApp(firebaseConfig);
        getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Friend requests: list + in-app popup with accept/decline, on every page
        onAuthStateChanged(auth, (u) => { if (u) PingUI.startSocial(db, firestoreAll, u); });

        let currentUser = null;
        let userData = null;
        let userUnsub = null;
        let locationWatchId = null;
        let friendsKey = '';
        const friendListeners = {};   // uid -> unsubscribe
        const friendsMarkers = {};    // uid -> L.marker

        const $ = (id) => document.getElementById(id);

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (userUnsub) { userUnsub(); userUnsub = null; }

            if (user) {
                $('login-btn').classList.add('hidden');
                $('guest-pill').classList.add('hidden');
                $('guest-pill').classList.remove('flex');
                $('share-btn').classList.remove('hidden');

                userUnsub = onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if (!snap.exists() || !snap.data().username) {
                        window.location.replace('auth.html');
                        return;
                    }
                    userData = snap.data();
                    renderHeader(userData);
                    renderShareButton(!!userData.shareLocation);

                    if (userData.shareLocation) startLocationTracking();
                    else stopLocationTracking();

                    syncFriendListeners(userData.friends || []);
                });
            } else {
                userData = null;
                stopLocationTracking();
                syncFriendListeners([]);
                window.removeUserMarker();
                $('login-btn').classList.remove('hidden');
                $('points-chip').classList.add('hidden');
                $('me-avatar').classList.add('hidden');
                $('share-btn').classList.add('hidden');
                $('friends-pill').classList.add('hidden');
                $('friends-pill').classList.remove('flex');
                $('guest-pill').classList.remove('hidden');
                $('guest-pill').classList.add('flex');
            }
        });

        function renderHeader(data) {
            $('points-chip').classList.remove('hidden');
            PingUI.setPoints(data.points ?? 120);
            const avatar = $('me-avatar');
            avatar.classList.remove('hidden');
            avatar.innerHTML = PingUI.avatarHTML({ photoURL: data.photoURL, name: data.displayName || data.username, size: 'sm', frame: data.activeFrame });
            $('header-sub').innerHTML = `שלום, ${PingUI.nameHTML({ name: data.displayName || data.username, gradient: data.activeGradient })}`;
        }

        function renderShareButton(sharing) {
            const btn = $('share-btn');
            btn.setAttribute('aria-pressed', String(sharing));
            $('share-btn-icon').innerHTML = sharing ? '<span class="live-dot"></span>' : PingUI.icon('pin');
            $('share-btn-text').textContent = sharing ? 'משתפים מיקום' : 'שתפו מיקום';
        }

        window.toggleShareLocation = async function() {
            if (!currentUser || !userData) { window.location.href = 'auth.html'; return; }
            const btn = $('share-btn');
            const next = !userData.shareLocation;
            PingUI.setLoading(btn, true);
            try {
                await updateDoc(doc(db, "users", currentUser.uid), { shareLocation: next });
                PingUI.toast(next ? 'החברים שלכם רואים עכשיו את המיקום שלכם' : 'שיתוף המיקום הופסק', { type: 'success' });
            } catch (error) {
                console.error("Error toggling location:", error);
                PingUI.toast('לא הצלחנו לעדכן את שיתוף המיקום', { type: 'error' });
            } finally {
                PingUI.setLoading(btn, false);
            }
        };

        function startLocationTracking() {
            if (!navigator.geolocation || locationWatchId !== null) return;

            locationWatchId = navigator.geolocation.watchPosition(
                async (position) => {
                    const { latitude, longitude } = position.coords;
                    window.updateUserMarker([latitude, longitude], userData);
                    try {
                        await updateDoc(doc(db, "users", currentUser.uid), {
                            location: { latitude, longitude, updatedAt: new Date().toISOString() }
                        });
                    } catch (error) {
                        console.error("Error updating location:", error);
                    }
                },
                (error) => {
                    console.error("Geolocation error:", error);
                    if (error.code === 1) {
                        PingUI.toast('אין הרשאת מיקום. אפשרו אותה בהגדרות הדפדפן', { type: 'error', duration: 5000 });
                        stopLocationTracking();
                    }
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
            );
        }

        function stopLocationTracking() {
            if (locationWatchId !== null) {
                navigator.geolocation.clearWatch(locationWatchId);
                locationWatchId = null;
            }
        }

        // Keep exactly one listener per friend, even though the user doc updates often
        function syncFriendListeners(friends) {
            const key = friends.map(f => f.uid).sort().join(',');
            if (key === friendsKey) return;
            friendsKey = key;

            const wanted = new Set(friends.map(f => f.uid));
            Object.keys(friendListeners).forEach(uid => {
                if (!wanted.has(uid)) {
                    friendListeners[uid]();
                    delete friendListeners[uid];
                    removeFriendMarker(uid);
                }
            });

            friends.forEach(friend => {
                if (friendListeners[friend.uid]) return;
                friendListeners[friend.uid] = onSnapshot(doc(db, "users", friend.uid), (snap) => {
                    if (!snap.exists()) return;
                    const f = snap.data();
                    if (f.shareLocation && f.location) {
                        upsertFriendMarker(friend.uid, f);
                    } else {
                        removeFriendMarker(friend.uid);
                    }
                    updateFriendsPill();
                });
            });
            updateFriendsPill();
        }

        function timeAgo(iso) {
            if (!iso) return '';
            const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
            if (mins < 1) return 'עכשיו';
            if (mins < 60) return `לפני ${mins} דק׳`;
            const hours = Math.round(mins / 60);
            if (hours < 24) return `לפני ${hours} שע׳`;
            return `לפני ${Math.round(hours / 24)} ימים`;
        }

        function upsertFriendMarker(uid, f) {
            const { latitude, longitude } = f.location;
            const name = f.displayName || f.username;
            const icon = window.pinIcon(PingUI.avatarHTML({ photoURL: f.photoURL, name, frame: f.activeFrame }), 'friend');
            const popup = `
                <div style="min-width:160px">
                    <div style="font-weight:800;font-size:15px">${PingUI.nameHTML({ name, gradient: f.activeGradient })}</div>
                    <div style="color:#8A847A;font-size:12px">@${PingUI.escapeHtml(f.username)} · ${timeAgo(f.location.updatedAt)}</div>
                    <a href="chat.html?with=${encodeURIComponent(uid)}" class="btn btn-primary btn-sm btn-block" style="margin-top:10px;color:#1C1917">שליחת הודעה</a>
                </div>`;
            if (friendsMarkers[uid]) {
                const m = friendsMarkers[uid].setLatLng([latitude, longitude]).setPopupContent(popup);
                if (m._pingHtml !== icon.options.html) { m.setIcon(icon); m._pingHtml = icon.options.html; }
            } else {
                friendsMarkers[uid] = L.marker([latitude, longitude], { icon }).addTo(window.map).bindPopup(popup);
                friendsMarkers[uid]._pingHtml = icon.options.html;
            }
        }

        function removeFriendMarker(uid) {
            if (friendsMarkers[uid]) {
                window.map.removeLayer(friendsMarkers[uid]);
                delete friendsMarkers[uid];
            }
        }

        function updateFriendsPill() {
            const pill = $('friends-pill');
            const total = (userData?.friends || []).length;
            const onMap = Object.keys(friendsMarkers).length;
            if (!currentUser) return;
            pill.classList.remove('hidden');
            pill.classList.add('flex');
            if (total === 0) {
                $('friends-pill-text').textContent = 'הוסיפו חברים כדי לראות אותם כאן';
                pill.onclick = () => { window.location.href = 'chat.html?add=1'; };
            } else {
                $('friends-pill-text').textContent = onMap === 0
                    ? 'אף חבר לא משתף מיקום כרגע'
                    : onMap === 1 ? 'חבר אחד על המפה' : `${onMap} חברים על המפה`;
                pill.onclick = () => window.fitToFriends();
            }
        }

        window.fitToFriends = function() {
            const points = Object.values(friendsMarkers).map(m => m.getLatLng());
            if (window.lastKnownPosition) points.push(L.latLng(window.lastKnownPosition));
            if (points.length === 0) return;
            if (points.length === 1) window.map.flyTo(points[0], 16, { duration: .8 });
            else window.map.flyToBounds(L.latLngBounds(points), { padding: [70, 70], duration: .8, maxZoom: 16 });
        };

        window.getCurrentUser = () => currentUser;
        window.getUserData = () => userData;
    </script>
</body>
</html>
