<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#FFFFFF">
    <title>Ping - צ'אט</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%23FFC400%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-linecap%3D%22round%22%20stroke-width%3D%224.5%22%3E%3Cpath%20d%3D%22M33.5%2022.5A11%2011%200%201%200%2033.5%2041.5%22%2F%3E%3Cpath%20d%3D%22M39.5%2022.4A15%2015%200%200%201%2039.5%2041.6%22%2F%3E%3Cpath%20d%3D%22M38%2014.7A20%2020%200%201%200%2038%2049.3%22%2F%3E%3Cpath%20d%3D%22M45.7%2014.3A25%2025%200%200%201%2045.7%2049.7%22%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2228%22%20cy%3D%2232%22%20r%3D%225%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ping shared UI helpers -->
    <script>
    /* ==========================================================================
       Ping – shared UI helpers (classic script, load right after Tailwind CDN)
       ========================================================================== */

    // Tailwind theme shared by all pages
    window.tailwind = window.tailwind || {};
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    brand: {
                        50: '#FFFBEA', 100: '#FFF6D1', 200: '#FFEBA3', 300: '#FFDD66',
                        400: '#FFCF26', 500: '#FFC400', 600: '#E5A800', 700: '#B38200',
                        800: '#6B4E00', 900: '#4D3800'
                    },
                    ink: { DEFAULT: '#1C1917', 2: '#57534E', muted: '#8A847A' },
                    line: '#E9E4D8',
                    canvas: '#F7F5F0'
                },
                fontFamily: { sans: ['Heebo', 'Assistant', 'system-ui', 'sans-serif'] }
            }
        }
    };


    /* ---------- Splash screen: 2s animation on the first page of each app session ---------- */
    (function () {
        // After entry animations have played once, stop them from replaying on re-renders
        function settle(delay) {
            const go = () => setTimeout(() => document.body && document.body.classList.add('anim-settled'), delay);
            if (document.body) go(); else document.addEventListener('DOMContentLoaded', go);
        }
        let show = false;
        try { show = !sessionStorage.getItem('ping:splash'); } catch (e) { show = false; }
        if (!show || window.matchMedia('(prefers-reduced-motion: reduce)').matches) { settle(1500); return; }
        settle(1650 + 1500);
        try { sessionStorage.setItem('ping:splash', '1'); } catch (e) {}
        document.documentElement.classList.add('ping-splashing');
        const started = Date.now();

        function mount() {
            const el = document.createElement('div');
            el.className = 'splash';
            el.setAttribute('aria-hidden', 'true');
            el.innerHTML = `
                <div class="splash__stage">
                    <span class="splash__ring"></span><span class="splash__ring"></span><span class="splash__ring"></span>
                    <svg class="splash__logo" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-linecap="round">
                        <circle cx="28" cy="32" r="5" fill="#fff" stroke="none"/>
                        <path d="M33.5 22.5A11 11 0 1 0 33.5 41.5" stroke-width="4.5"/>
                        <path d="M39.5 22.4A15 15 0 0 1 39.5 41.6" stroke-width="4.5"/>
                        <path d="M38 14.7A20 20 0 1 0 38 49.3" stroke-width="4.5"/>
                        <path d="M45.7 14.3A25 25 0 0 1 45.7 49.7" stroke-width="4.5"/>
                    </svg>
                </div>
                <div class="splash__word" dir="ltr"><span>P</span><span>i</span><span>n</span><span>g</span></div>
                <div class="splash__tag">גלו מה קורה מסביבכם</div>`;
            document.body.appendChild(el);
            setTimeout(() => {
                document.documentElement.classList.remove('ping-splashing');
                el.classList.add('is-leaving');
                setTimeout(() => el.remove(), 400);
            }, Math.max(0, 1650 - (Date.now() - started)));
        }
        if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
    })();

    /* ---------- Smooth page transitions for the bottom nav ---------- */
    document.addEventListener('click', (e) => {
        const a = e.target.closest && e.target.closest('a.nav-item');
        if (!a || a.getAttribute('aria-current') === 'page' || e.ctrlKey || e.metaKey || e.shiftKey) return;
        e.preventDefault();
        document.body.classList.add('page-leave');
        setTimeout(() => { window.location.href = a.href; }, 140);
    });
    window.addEventListener('pageshow', () => document.body && document.body.classList.remove('page-leave'));

    (function () {
        const S = (d, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${d}</svg>`;

        const ICONS = {
            map: S('<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/>'),
            chat: S('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12Z"/>'),
            shop: S('<path d="M6 7h12l1 13H5L6 7Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/>'),
            user: S('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
            settings: S('<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>'),
            check: S('<path d="m5 12 5 5L20 7"/>', 'stroke-width="3"'),
            x: S('<path d="M18 6 6 18M6 6l12 12"/>'),
            alert: S('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>'),
            info: S('<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>'),
            coin: S('<circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.4-.9-1.3-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1.2 0-2.1-.6-2.5-1.5M12 6.5V8M12 16v1.5"/>'),
            gift: S('<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v9H5v-9"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>'),
            image: S('<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>'),
            send: S('<path d="M4 12 20 4l-4 16-4-7-8-1Z"/><path d="m12 13 8-9"/>'),
            plus: S('<path d="M12 5v14M5 12h14"/>'),
            userPlus: S('<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/>'),
            users: S('<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/>'),
            locate: S('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/>'),
            pin: S('<path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/>'),
            pinOff: S('<path d="M8.4 4.1A7 7 0 0 1 19 9.5c0 1.8-.8 3.7-1.9 5.4M14.8 18.1C13.3 19.8 12 21 12 21s-7-6.1-7-11.5c0-.9.2-1.8.5-2.6M3 3l18 18"/>'),
            camera: S('<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/>'),
            logout: S('<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/>'),
            edit: S('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/>'),
            shield: S('<path d="M12 3 4 6v6c0 5 3.4 8.3 8 9 4.6-.7 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/>'),
            chevron: S('<path d="m9 6 6 6-6 6"/>'),
            play: S('<circle cx="12" cy="12" r="9"/><path d="m10 8.5 5 3.5-5 3.5v-7Z" fill="currentColor"/>'),
            share: S('<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>'),
            sparkles: S('<path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4L12 3Z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2Z"/>'),
            palette: S('<path d="M12 3a9 9 0 1 0 0 18c1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7h2A4.7 4.7 0 0 0 21 10.5C21 6.4 17 3 12 3Z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10" cy="7" r="1" fill="currentColor"/><circle cx="15" cy="7" r="1" fill="currentColor"/>'),
            frame: S('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/>'),
            lock: S('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
            arrowRight: S('<path d="M5 12h14M13 6l6 6-6 6"/>'),
            mail: S('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'),
            at: S('<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>'),
            globe: S('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'),
            heart: S('<path d="M12 20s-7.5-4.6-9.3-9.2C1.5 7.5 3.7 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.5 0 5.7 3.5 4.5 6.8C19.5 15.4 12 20 12 20Z"/>'),
            heartFill: S('<path d="M12 20s-7.5-4.6-9.3-9.2C1.5 7.5 3.7 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.5 0 5.7 3.5 4.5 6.8C19.5 15.4 12 20 12 20Z" fill="currentColor"/>'),
            flame: S('<path d="M12 22c4 0 7-2.7 7-6.6 0-3.1-1.8-5.4-3.4-7.2-.4 1.6-1.3 2.7-2.4 3.2.3-3.3-1.2-6.6-4.2-9.4.2 3.4-1.6 5.6-3.3 7.6C4.5 11.1 5 12.6 5 15.4 5 19.3 8 22 12 22Z"/>'),
            grid: S('<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>'),
            imagePlus: S('<path d="M21 12v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h6"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4-4L6 21M18 3v6M15 6h6"/>'),
            trash: S('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
            restore: S('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>')
        };

        const LOGO = `<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-linecap="round" aria-hidden="true">
            <circle cx="28" cy="32" r="5" fill="#fff" stroke="none"/>
            <path d="M33.5 22.5A11 11 0 1 0 33.5 41.5" stroke-width="4.5"/>
            <path d="M39.5 22.4A15 15 0 0 1 39.5 41.6" stroke-width="4.5"/>
            <path d="M38 14.7A20 20 0 1 0 38 49.3" stroke-width="4.5"/>
            <path d="M45.7 14.3A25 25 0 0 1 45.7 49.7" stroke-width="4.5"/>
        </svg>`;

        const NAV = [
            { id: 'home', href: 'index.html', label: 'מפה', icon: 'map' },
            { id: 'feed', href: 'feed.html', label: 'פוסטים', icon: 'grid' },
            { id: 'chat', href: 'chat.html', label: "צ'אט", icon: 'chat' },
            { id: 'shop', href: 'shop.html', label: 'חנות', icon: 'shop' },
            { id: 'profile', href: 'profile.html', label: 'פרופיל', icon: 'user' }
        ];

        const icon = (name) => ICONS[name] || '';

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // Only allow http(s) URLs and inline base64 images into src attributes
        function safeUrl(url) {
            const u = String(url || '');
            if (/^https?:\/\//i.test(u)) return escapeHtml(u);
            if (/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(u)) return u;
            return '';
        }

        function initialOf(name) {
            const s = String(name || '').trim();
            return s ? s.charAt(0).toUpperCase() : '?';
        }

        function avatarHTML({ photoURL, name, size = 'md', frame = '', extraClass = '' } = {}) {
            const src = safeUrl(photoURL);
            const frameCls = /^frame[_-][a-z]+$/.test(frame || '') ? frame : '';
            const inner = src
                ? `<img src="${src}" alt="" loading="lazy" referrerpolicy="no-referrer">`
                : escapeHtml(initialOf(name));
            return `<span class="avatar avatar--${size} ${frameCls} ${extraClass}">${inner}</span>`;
        }

        function gradClass(grad) {
            return /^grad[_-][a-z]+$/.test(grad || '') ? grad : '';
        }

        function formatNumber(n) {
            return Number(n || 0).toLocaleString('he-IL');
        }

        /* ---------- Toasts ---------- */
        let toastRegion;
        function toast(message, { type = 'info', duration = 3200, action } = {}) {
            if (!toastRegion) {
                toastRegion = document.createElement('div');
                toastRegion.className = 'toast-region';
                toastRegion.setAttribute('role', 'status');
                toastRegion.setAttribute('aria-live', 'polite');
                document.body.appendChild(toastRegion);
            }
            const iconName = { success: 'check', error: 'alert', points: 'coin', info: 'info' }[type] || 'info';
            const el = document.createElement('div');
            el.className = `toast toast--${type}`;
            el.innerHTML = `<span class="toast__icon">${icon(iconName)}</span><span>${escapeHtml(message)}</span>`;
            if (action) {
                const a = document.createElement(action.href ? 'a' : 'button');
                a.className = 'toast__action';
                a.textContent = action.label;
                if (action.href) a.href = action.href;
                if (action.onClick) a.addEventListener('click', () => { action.onClick(); dismiss(); });
                el.appendChild(a);
            }
            toastRegion.appendChild(el);
            while (toastRegion.children.length > 3) toastRegion.firstChild.remove();

            let timer = setTimeout(dismiss, duration);
            el.addEventListener('mouseenter', () => clearTimeout(timer));
            el.addEventListener('mouseleave', () => { timer = setTimeout(dismiss, 1500); });
            function dismiss() {
                el.classList.add('is-leaving');
                setTimeout(() => el.remove(), 200);
            }
            return dismiss;
        }

        /* ---------- Modals ---------- */
        const openStack = [];
        let lastFocus = null;

        function openModal(id) {
            const m = typeof id === 'string' ? document.getElementById(id) : id;
            if (!m || m.classList.contains('is-open')) return;
            lastFocus = document.activeElement;
            m.classList.add('is-open');
            m.setAttribute('aria-hidden', 'false');
            openStack.push(m);
            const focusTarget = m.querySelector('[autofocus], input:not([type=hidden]), button.btn-primary, button');
            if (focusTarget) setTimeout(() => focusTarget.focus({ preventScroll: true }), 60);
        }

        function closeModal(id) {
            const m = id
                ? (typeof id === 'string' ? document.getElementById(id) : id)
                : openStack[openStack.length - 1];
            if (!m || !m.classList.contains('is-open')) return;
            m.classList.remove('is-open');
            m.setAttribute('aria-hidden', 'true');
            const i = openStack.indexOf(m);
            if (i >= 0) openStack.splice(i, 1);
            m.dispatchEvent(new CustomEvent('modal:close'));
            if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape' || !openStack.length) return;
            const top = openStack[openStack.length - 1];
            if (top.dataset.static === undefined) closeModal(top);
        });

        document.addEventListener('click', (e) => {
            const closer = e.target.closest('[data-close-modal]');
            if (closer) { closeModal(closer.closest('.modal')); return; }
            if (e.target.classList && e.target.classList.contains('modal') && e.target.dataset.static === undefined) {
                closeModal(e.target);
            }
        });

        /* ---------- Confirm dialog ---------- */
        function confirmDialog({ title, message, confirmText = 'אישור', cancelText = 'ביטול', tone = 'primary', iconName } = {}) {
            return new Promise((resolve) => {
                const m = document.createElement('div');
                m.className = 'modal';
                m.setAttribute('role', 'dialog');
                m.setAttribute('aria-modal', 'true');
                const hero = iconName
                    ? `<div class="modal__hero ${tone === 'danger' ? 'modal__hero--danger' : ''}">${icon(iconName)}</div>`
                    : '';
                m.innerHTML = `
                    <div class="modal__panel text-center">
                        <div class="modal__grabber"></div>
                        ${hero}
                        <h3 class="modal__title">${escapeHtml(title)}</h3>
                        ${message ? `<p class="modal__text mt-2">${escapeHtml(message)}</p>` : ''}
                        <div class="modal__actions">
                            <button type="button" class="btn btn-soft" data-act="cancel">${escapeHtml(cancelText)}</button>
                            <button type="button" class="btn ${tone === 'danger' ? 'btn-danger' : 'btn-primary'}" data-act="ok">${escapeHtml(confirmText)}</button>
                        </div>
                    </div>`;
                document.body.appendChild(m);
                let result = false;
                m.querySelector('[data-act="ok"]').addEventListener('click', () => { result = true; closeModal(m); });
                m.querySelector('[data-act="cancel"]').addEventListener('click', () => closeModal(m));
                m.addEventListener('modal:close', () => { resolve(result); setTimeout(() => m.remove(), 50); });
                openModal(m);
                setTimeout(() => m.querySelector('[data-act="ok"]').focus(), 60);
            });
        }

        /* ---------- Button loading ---------- */
        function setLoading(btn, loading) {
            if (!btn) return;
            btn.classList.toggle('is-loading', !!loading);
            btn.disabled = !!loading;
            btn.setAttribute('aria-busy', loading ? 'true' : 'false');
        }

        /* ---------- Points chip ---------- */
        function setPoints(value) {
            document.querySelectorAll('[data-points]').forEach((el) => {
                const prev = el.dataset.value;
                const next = String(value ?? 0);
                el.textContent = formatNumber(value);
                if (prev !== undefined && prev !== next) {
                    const chip = el.closest('.points-chip');
                    if (chip) { chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
                }
                el.dataset.value = next;
            });
        }

        /* ---------- Auto-render nav + logos ---------- */
        function renderNav(nav) {
            const active = nav.dataset.pingNav;
            nav.classList.add('bottom-nav');
            nav.setAttribute('aria-label', 'ניווט ראשי');
            nav.innerHTML = NAV.map((t) => `
                <a href="${t.href}" class="nav-item" data-nav-id="${t.id}" ${t.id === active ? 'aria-current="page"' : ''}>
                    <span class="nav-item__icon">${icon(t.icon)}</span>
                    <span>${t.label}</span>
                </a>`).join('');
        }

        function setNavBadge(id, count) {
            const item = document.querySelector(`.nav-item[data-nav-id="${id}"]`);
            if (!item) return;
            let b = item.querySelector('.nav-item__badge');
            if (!count) { if (b) b.remove(); return; }
            if (!b) { b = document.createElement('span'); b.className = 'nav-item__badge'; item.appendChild(b); }
            b.textContent = count > 9 ? '9+' : count;
        }

        function hydrate(root = document) {
            root.querySelectorAll('[data-ping-nav]').forEach(renderNav);
            root.querySelectorAll('[data-ping-logo]').forEach((el) => {
                el.classList.add('ping-logo');
                el.innerHTML = LOGO;
            });
            root.querySelectorAll('[data-icon]').forEach((el) => {

        /* ---------- Image upload ----------
           Images are resized/compressed in the browser first. If a Cloudinary
           *unsigned* upload preset named CLOUDINARY.preset exists, the image is
           hosted there; otherwise it falls back to a compact inline data URL that
           is saved directly in Firestore, so uploads always work. */
        const CLOUDINARY = { cloud: 'lf1jkqoz', preset: 'ping_unsigned' };
        const UPLOAD_PROFILES = {
            avatar: { max: 512, fallbackMax: 192, fallbackBytes: 24000 },
            chat: { max: 1600, fallbackMax: 1080, fallbackBytes: 380000 },
            post: { max: 1600, fallbackMax: 1080, fallbackBytes: 420000 }
        };
        const NO_CLOUD_KEY = 'ping:cloudinary-unavailable';

        async function loadBitmap(file) {
            if (window.createImageBitmap) {
                try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* fall through */ }
            }
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
                img.src = url;
            });
        }

        async function compressImage(file, { maxSize = 1600, quality = 0.82, maxBytes = 0 } = {}) {
            const bmp = await loadBitmap(file);
            let w = bmp.width, h = bmp.height;
            let scale = Math.min(1, maxSize / Math.max(w, h));
            const canvas = document.createElement('canvas');
            const toBlob = (q) => new Promise((r) => canvas.toBlob(r, 'image/jpeg', q));
            let q = quality, blob;
            for (let attempt = 0; attempt < 8; attempt++) {
                canvas.width = Math.max(1, Math.round(w * scale));
                canvas.height = Math.max(1, Math.round(h * scale));
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
                blob = await toBlob(q);
                if (!maxBytes || blob.size <= maxBytes) break;
                if (q > 0.5) q -= 0.12; else scale *= 0.8;
            }
            if (bmp.close) bmp.close();
            return blob;
        }

        const blobToDataURL = (blob) => new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(r.result);
            r.onerror = reject;
            r.readAsDataURL(blob);
        });

        async function uploadImage(file, kind = 'post') {
            if (!file || !file.type || !file.type.startsWith('image/')) throw new Error('not-image');
            if (file.size > 25 * 1024 * 1024) throw new Error('too-large');
            const p = UPLOAD_PROFILES[kind] || UPLOAD_PROFILES.post;

            let cloudOff = false;
            try { cloudOff = sessionStorage.getItem(NO_CLOUD_KEY) === '1'; } catch (e) {}

            if (!cloudOff && CLOUDINARY.preset) {
                try {
                    const blob = await compressImage(file, { maxSize: p.max, quality: 0.85 });
                    const fd = new FormData();
                    fd.append('file', blob, 'image.jpg');
                    fd.append('upload_preset', CLOUDINARY.preset);
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloud}/image/upload`, { method: 'POST', body: fd });
                    const data = await res.json();
                    if (data.secure_url) return data.secure_url;
                    console.warn('Cloudinary upload failed, using inline image:', data.error && data.error.message);
                    if (data.error && /preset/i.test(data.error.message || '')) {
                        try { sessionStorage.setItem(NO_CLOUD_KEY, '1'); } catch (e) {}
                    }
                } catch (e) {
                    console.warn('Cloudinary unreachable, using inline image:', e);
                }
            }

            const small = await compressImage(file, { maxSize: p.fallbackMax, quality: 0.8, maxBytes: p.fallbackBytes });
            return blobToDataURL(small);
        }

        function uploadErrorMessage(err) {
            const m = err && err.message;
            if (m === 'not-image') return 'אפשר להעלות רק קבצי תמונה';
            if (m === 'too-large') return 'התמונה גדולה מדי (עד 25MB)';
            if (m === 'unreadable') return 'לא הצלחנו לקרוא את התמונה. נסו פורמט JPG או PNG';
            return 'ההעלאה נכשלה, נסו שוב';
        }

        /* ---------- Chat streaks ----------
           A day counts when BOTH friends sent at least one message that day.
           Every 10 days each friend can claim 100 points (claimed by each user
           for themselves). A broken streak can be restored for 70 points within
           7 days. */
        const STREAK = { REWARD_EVERY: 10, REWARD_POINTS: 100, RESTORE_COST: 70, RESTORE_WINDOW_DAYS: 7, MIN_RESTORE: 2 };

        const pad = (n) => String(n).padStart(2, '0');
        function dayKey(d = new Date()) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
        function addDays(key, n) {
            const [y, m, d] = key.split('-').map(Number);
            return dayKey(new Date(y, m - 1, d + n));
        }

        function normalizeStreak(s) {
            s = s || {};
            return {
                count: s.count || 0,
                lastDay: s.lastDay || null,
                lastSent: { ...(s.lastSent || {}) },
                lost: s.lost || null,
                milestones: s.milestones || 0,
                claimed: { ...(s.claimed || {}) }
            };
        }

        // Returns the new streak after `me` sends a message today, plus whether a day was completed
        function streakApplySend(raw, me, other, today = dayKey()) {
            const s = normalizeStreak(raw);
            s.lastSent[me] = today;
            let completed = false;
            if (s.lastSent[other] === today && s.lastDay !== today) {
                if (s.lastDay === addDays(today, -1)) {
                    s.count += 1;
                } else {
                    if (s.count >= STREAK.MIN_RESTORE) s.lost = { count: s.count, at: today };
                    s.count = 1;
                }
                s.lastDay = today;
                if (s.count % STREAK.REWARD_EVERY === 0) s.milestones += 1;
                completed = true;
            }
            return { streak: s, completed };
        }

        function streakStatus(raw, me, other, today = dayKey()) {
            const s = normalizeStreak(raw);
            const yesterday = addDays(today, -1);
            const windowStart = addDays(today, -STREAK.RESTORE_WINDOW_DAYS);
            let state = 'none', count = 0, restore = null;

            if (s.count > 0 && s.lastDay === today) { state = 'active'; count = s.count; }
            else if (s.count > 0 && s.lastDay === yesterday) { state = 'atRisk'; count = s.count; }
            else if (s.count > 0) {
                state = 'broken';
                if (s.count >= STREAK.MIN_RESTORE && s.lastDay >= windowStart) restore = { type: 'resume', count: s.count };
            }
            if (!restore && s.lost && s.lost.count >= STREAK.MIN_RESTORE && s.lost.at >= windowStart) {
                restore = { type: 'merge', count: s.lost.count };
            }

            const next = (Math.floor(count / STREAK.REWARD_EVERY) + 1) * STREAK.REWARD_EVERY;
            return {
                state, count, restore,
                nextMilestone: next,
                daysToNext: next - count,
                progress: (count % STREAK.REWARD_EVERY) / STREAK.REWARD_EVERY,
                meToday: s.lastSent[me] === today,
                otherToday: s.lastSent[other] === today,
                claimable: Math.max(0, s.milestones - (s.claimed[me] || 0))
            };
        }

        function streakApplyRestore(raw, today = dayKey()) {
            const s = normalizeStreak(raw);
            const st = streakStatus(s, '', '', today);
            if (!st.restore) return null;
            if (st.restore.type === 'resume') {
                s.lastDay = addDays(today, -1); // bridge the gap; chatting today continues it
            } else {
                const before = s.count;
                const lostCount = s.lost.count;
                s.count = lostCount + before;
                const E = STREAK.REWARD_EVERY;
                s.milestones += Math.max(0, Math.floor(s.count / E) - Math.floor(lostCount / E) - Math.floor(before / E));
            }
            s.lost = null;
            return s;
        }

        function streakClaim(raw, me) {
            const s = normalizeStreak(raw);
            const n = Math.max(0, s.milestones - (s.claimed[me] || 0));
            s.claimed[me] = s.milestones;
            return { streak: s, rewards: n, points: n * STREAK.REWARD_POINTS };
        }

        /* ---------- Post likes ----------
           Likers only touch the post (likedBy / everLiked). The author's own
           client turns new likes into points (3 each), so no one writes to
           another user's balance. everLiked never shrinks, so unlike+relike
           can't be farmed. */
        const LIKE_POINTS = 3;
        const likeClaiming = new Set();
        async function claimLikeRewards(db, fs, posts, uid) {
            const pending = posts.filter(p => p.uid === uid && !likeClaiming.has(p.id) &&
                (p.everLiked || []).length > (p.rewardedLikes || 0));
            let likes = 0;
            for (const p of pending) {
                likeClaiming.add(p.id);
                try {
                    likes += await fs.runTransaction(db, async (tx) => {
                        const ref = fs.doc(db, 'posts', p.id);
                        const snap = await tx.get(ref);
                        if (!snap.exists() || snap.data().uid !== uid) return 0;
                        const d = snap.data();
                        const total = (d.everLiked || []).length;
                        const n = total - (d.rewardedLikes || 0);
                        if (n <= 0) return 0;
                        tx.update(ref, { rewardedLikes: total });
                        tx.update(fs.doc(db, 'users', uid), { points: fs.increment(n * LIKE_POINTS) });
                        return n;
                    });
                } catch (e) {
                    console.warn('Like reward claim failed:', e);
                } finally {
                    likeClaiming.delete(p.id);
                }
            }
            if (likes) {
                toast(`❤️ ${likes === 1 ? 'לייק חדש' : `${likes} לייקים חדשים`} · +${likes * LIKE_POINTS} נקודות`, { type: 'points', duration: 4000 });
            }
        }

        /* ---------- Time ---------- */
        function timeAgo(date) {
            if (!date) return 'עכשיו';
            const d = date instanceof Date ? date : new Date(date);
            const mins = Math.round((Date.now() - d.getTime()) / 60000);
            if (mins < 1) return 'עכשיו';
            if (mins < 60) return `לפני ${mins} דק׳`;
            const hours = Math.round(mins / 60);
            if (hours < 24) return `לפני ${hours} שע׳`;
            const days = Math.round(hours / 24);
            if (days < 7) return days === 1 ? 'אתמול' : `לפני ${days} ימים`;
            return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'short' });
        }

        /* ---------- Guest gating ----------
           Guests (anonymous sign-in) can browse, chat and like, but posting
           and friends need a Google account. Linking keeps the same account. */
        function isGuestUser(user, data) {
            return !!((user && user.isAnonymous) || (data && data.isGuest));
        }
        async function requireGoogle(reason) {

                message: `${reason} הנקודות והפריטים שצברתם כאורחים יישמרו.`,

        /* ---------- Live profiles ----------
           Friends lists, messages and posts keep a copy of a person's photo/name from when
           they were saved, so it goes stale. Pages render with live profiles instead:
           friends (and you) are watched in real time, anyone else is fetched once.
           Your own friends list is also refreshed so every page shows current info. */
        const profiles = {};          // uid -> { uid, username, displayName, photoURL, activeFrame, activeGradient }
        const profileSubs = {};       // uid -> unsubscribe
        const profileFetching = new Set();
        const live = { db: null, fs: null, user: null, started: false, friendsKey: '' };
        let profilesEmitTimer = null;
        let friendsRefreshTimer = null;

        function emitProfiles() {
            clearTimeout(profilesEmitTimer);
            profilesEmitTimer = setTimeout(() => window.dispatchEvent(new CustomEvent('ping:profiles')), 60);
        }

        function pickProfile(uid, d) {
            return {
                uid, username: d.username || '', displayName: d.displayName || d.username || '',
                photoURL: d.photoURL || '', activeFrame: d.activeFrame || '', activeGradient: d.activeGradient || ''
            };
        }

        function setProfile(uid, d) {
            const next = pickProfile(uid, d);
            const prev = profiles[uid];
            profiles[uid] = next;
            if (!prev || JSON.stringify(prev) !== JSON.stringify(next)) emitProfiles();
        }

        function watchProfile(uid) {
            if (profileSubs[uid] || !live.started) return;
            const { db, fs } = live;
            profileSubs[uid] = fs.onSnapshot(fs.doc(db, 'users', uid), (snap) => {
                if (snap.exists()) { setProfile(uid, snap.data()); scheduleFriendsRefresh(); }
            }, (err) => console.warn('Profile listener:', err));
        }

        async function fetchProfile(uid) {
            if (!live.started || profiles[uid] || profileFetching.has(uid)) return;
            profileFetching.add(uid);
            try {
                const snap = await live.fs.getDoc(live.fs.doc(live.db, 'users', uid));
                if (snap.exists()) setProfile(uid, snap.data());
            } catch (e) { /* keep the saved copy */ }
        }

        function startProfiles(db, fs, user) {
            if (live.started) return;
            Object.assign(live, { db, fs, user, started: true });
            profileSubs[user.uid] = fs.onSnapshot(fs.doc(db, 'users', user.uid), (snap) => {
                if (!snap.exists()) return;
                const me = snap.data();
                setProfile(user.uid, me);
                const friends = me.friends || [];
                const key = friends.map(f => f.uid).sort().join(',');
                if (key !== live.friendsKey) {
                    live.friendsKey = key;
                    const wanted = new Set(friends.map(f => f.uid));
                    Object.keys(profileSubs).forEach(uid => {
                        if (uid !== user.uid && !wanted.has(uid)) { profileSubs[uid](); delete profileSubs[uid]; }
                    });
                    friends.forEach(f => watchProfile(f.uid));
                }
                scheduleFriendsRefresh(me);
            }, (err) => console.warn('Own profile listener:', err));
        }

        // Rewrite my saved friends list when a friend changed their photo / name / username
        function scheduleFriendsRefresh() {
            clearTimeout(friendsRefreshTimer);
            friendsRefreshTimer = setTimeout(refreshFriendsList, 1500);
        }
        async function refreshFriendsList() {
            const { db, fs, user } = live;
            try {
                await fs.runTransaction(db, async (tx) => {
                    const ref = fs.doc(db, 'users', user.uid);
                    const snap = await tx.get(ref);
                    if (!snap.exists()) return;
                    const friends = snap.data().friends || [];
                    let changed = false;
                    const next = friends.map(f => {
                        const p = profiles[f.uid];
                        if (!p) return f;
                        if (f.photoURL === p.photoURL && f.displayName === p.displayName && f.username === p.username) return f;
                        changed = true;
                        return { ...f, photoURL: p.photoURL, displayName: p.displayName, username: p.username };
                    });
                    if (changed) tx.update(ref, { friends: next });
                });
            } catch (e) {
                console.warn('Friends list refresh failed:', e);
            }
        }

        // Current look of a user; falls back to the copy saved in a message / post / friends list
        function liveProfile(uid, fb = {}) {
            const p = uid ? profiles[uid] : null;
            if (uid && !p) fetchProfile(uid);
            return {
                uid,
                username: (p && p.username) || fb.username || '',
                name: (p && p.displayName) || fb.displayName || fb.name || fb.username || '',
                photoURL: p ? p.photoURL : (fb.photoURL || ''),
                frame: p ? p.activeFrame : (fb.frame || fb.activeFrame || ''),
                gradient: p ? p.activeGradient : (fb.gradient || fb.activeGradient || '')
            };
        }

        // A person's name, painted in their purchased gradient
        function nameHTML(p) {
            return `<span class="${gradClass(p.gradient)}">${escapeHtml(p.name)}</span>`;
        }

        /* ---------- Friend requests ----------
           friendRequests/{fromUid}_{toUid}: { fromUid, from*, toUid, to*, status: pending|accepted|declined, linked }
           - The recipient accepts: adds the sender to THEIR OWN friends and marks the request accepted.
           - The sender's app then sees "accepted" and adds the recipient to ITS OWN friends (linked: true).
           Nobody writes to another user's profile document. */
        const social = { db: null, fs: null, user: null, incoming: [], outgoing: [], started: false };
        const SEEN_KEY = 'ping:req-seen';
        const reqId = (from, to) => from + '_' + to;
        const linking = new Set();

        function emitRequests() {
            setNavBadge('chat', social.incoming.length);
            window.dispatchEvent(new CustomEvent('ping:requests', { detail: { incoming: social.incoming, outgoing: social.outgoing } }));
        }

        function readSeen() { try { return new Set(JSON.parse(sessionStorage.getItem(SEEN_KEY) || '[]')); } catch (e) { return new Set(); } }
        function writeSeen(set) { try { sessionStorage.setItem(SEEN_KEY, JSON.stringify([...set])); } catch (e) {} }

        function startSocial(db, fs, user) {
            if (!user) return;
            startProfiles(db, fs, user);
            if (social.started || user.isAnonymous) return;
            Object.assign(social, { db, fs, user, started: true });
            const col = fs.collection(db, 'friendRequests');
            const ms = (r) => (r.createdAt && r.createdAt.toMillis ? r.createdAt.toMillis() : Date.now());

            fs.onSnapshot(fs.query(col, fs.where('toUid', '==', user.uid), fs.where('status', '==', 'pending')), (snap) => {
                social.incoming = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ms(b) - ms(a));
                emitRequests();
                const seen = readSeen();
                social.incoming.forEach(r => { if (!seen.has(r.id)) { seen.add(r.id); showRequestBanner(r); } });
                writeSeen(seen);
            }, (err) => console.warn('Incoming requests listener:', err));

            fs.onSnapshot(fs.query(col, fs.where('fromUid', '==', user.uid)), (snap) => {
                const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                social.outgoing = all.filter(r => r.status === 'pending').sort((a, b) => ms(b) - ms(a));
                emitRequests();
                all.filter(r => r.status === 'accepted' && !r.linked).forEach(linkAccepted);
            }, (err) => console.warn('Outgoing requests listener:', err));
        }

        // Sender side: the other person accepted, add them to my friends
        async function linkAccepted(req) {
            if (linking.has(req.id)) return;
            linking.add(req.id);
            const { db, fs, user } = social;
            try {
                const added = await fs.runTransaction(db, async (tx) => {
                    const uref = fs.doc(db, 'users', user.uid);
                    const rref = fs.doc(db, 'friendRequests', req.id);
                    const us = await tx.get(uref);
                    const rs = await tx.get(rref);
                    if (!rs.exists() || rs.data().linked) return false;
                    const r = rs.data();
                    const friends = (us.data() && us.data().friends) || [];
                    if (!friends.some(f => f.uid === r.toUid)) {
                        tx.update(uref, { friends: [...friends, { uid: r.toUid, username: r.toUsername || '', displayName: r.toDisplayName || r.toUsername || '', photoURL: r.toPhotoURL || '' }] });
                    }
                    tx.update(rref, { linked: true });
                    return true;
                });
                if (added) {
                    toast(`${req.toDisplayName || req.toUsername} אישר/ה את בקשת החברות שלך 🎉`, {
                        type: 'success', duration: 5000,
                        action: { label: 'שליחת הודעה', href: 'chat.html?with=' + encodeURIComponent(req.toUid) }
                    });
                }
            } catch (e) {
                console.warn('Linking accepted request failed:', e);
            } finally {
                linking.delete(req.id);
            }
        }

        // Recipient side
        async function acceptFriendRequest(req) {
            const { db, fs, user } = social;
            const name = req.fromDisplayName || req.fromUsername;
            try {
                await fs.runTransaction(db, async (tx) => {
                    const uref = fs.doc(db, 'users', user.uid);
                    const rref = fs.doc(db, 'friendRequests', req.id);
                    const us = await tx.get(uref);
                    const rs = await tx.get(rref);
                    if (!rs.exists() || rs.data().status !== 'pending') throw new Error('gone');
                    const me = us.data();
                    const friends = me.friends || [];
                    if (!friends.some(f => f.uid === req.fromUid)) {
                        tx.update(uref, { friends: [...friends, { uid: req.fromUid, username: req.fromUsername, displayName: name, photoURL: req.fromPhotoURL || '' }] });
                    }
                    tx.update(rref, {
                        status: 'accepted',
                        toUsername: me.username, toDisplayName: me.displayName || me.username, toPhotoURL: me.photoURL || '',
                        respondedAt: new Date().toISOString()
                    });
                });
                toast(`${name} נוסף/ה לחברים שלך`, {
                    type: 'success', duration: 4500,
                    action: { label: 'שליחת הודעה', href: 'chat.html?with=' + encodeURIComponent(req.fromUid) }
                });
                return true;
            } catch (e) {
                console.error('Accept request failed:', e);
                toast(e.message === 'gone' ? 'הבקשה כבר לא בתוקף' : 'האישור נכשל, נסו שוב', { type: 'error' });
                return false;
            }
        }

        async function declineFriendRequest(req) {
            const { db, fs } = social;
            try {
                await fs.updateDoc(fs.doc(db, 'friendRequests', req.id), { status: 'declined', respondedAt: new Date().toISOString() });
                toast('הבקשה נדחתה', { duration: 2000 });
                return true;
            } catch (e) {
                console.error('Decline request failed:', e);
                toast('הדחייה נכשלה, נסו שוב', { type: 'error' });
                return false;
            }
        }

        async function cancelFriendRequest(req) {
            const { db, fs } = social;
            try {
                await fs.deleteDoc(fs.doc(db, 'friendRequests', req.id));
                toast('הבקשה בוטלה', { duration: 2000 });
            } catch (e) {
                console.error('Cancel request failed:', e);
                toast('הביטול נכשל', { type: 'error' });
            }
        }

        // Returns 'sent' | 'accepted' (they had already asked you) | throws Error(code)
        async function sendFriendRequest(me, target) {
            const { db, fs, user } = social;
            if (!user) throw new Error('not-ready');
            const reverse = await fs.getDoc(fs.doc(db, 'friendRequests', reqId(target.uid, user.uid)));
            if (reverse.exists() && reverse.data().status === 'pending') {
                const ok = await acceptFriendRequest({ id: reverse.id, ...reverse.data() });
                if (ok) return 'accepted';
                throw new Error('failed');
            }
            const existing = await fs.getDoc(fs.doc(db, 'friendRequests', reqId(user.uid, target.uid)));
            if (existing.exists() && existing.data().status === 'pending') throw new Error('already-pending');
            await fs.setDoc(fs.doc(db, 'friendRequests', reqId(user.uid, target.uid)), {

            });
            return 'sent';

                document.body.appendChild(bannerRegion);

            const el = document.createElement('div');
            el.className = 'req-banner';

            el.setAttribute('aria-label', 'בקשת חברות');

                <div class="req-banner__body">

                    <div class="req-banner__sub">שלח/ה לך בקשת חברות · <span dir="ltr">@${escapeHtml(req.fromUsername)}</span></div>
