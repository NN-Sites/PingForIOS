        .bubble--gift-done { background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-2); }
        .special-head { display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .special-icon { width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.75); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .special-icon svg { width: 20px; height: 20px; }

        .day-sep { align-self: center; margin: 18px 0 6px; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.9); border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--ink-2); }
        .msg-new { animation: ping-fade-up .25s ease both; }

        .jump-btn {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            display: none; align-items: center; gap: 6px;
            height: 36px; padding: 0 14px; border-radius: 999px;
            background: var(--ink); color: #fff; border: 0; font: inherit; font-size: 13px; font-weight: 700;
            box-shadow: var(--shadow-md); cursor: pointer; z-index: 5;
        }
        .jump-btn.is-visible { display: inline-flex; animation: ping-fade-up .2s ease; }

        /* Composer */
        .composer { flex-shrink: 0; background: rgba(255,255,255,.92); border-top: 1px solid var(--border); padding: 8px 12px; }
        .composer form { display: flex; align-items: flex-end; gap: 8px; max-width: 760px; margin: 0 auto; }
        .composer__input {
            flex: 1; min-height: 44px; max-height: 140px; resize: none;
            padding: 11px 16px; border-radius: 22px;
            border: 1.5px solid var(--border); background: var(--surface-2);
            font: inherit; font-size: 15px; line-height: 1.4; color: var(--ink);
            transition: border-color .15s ease, background-color .15s ease;
            box-sizing: border-box;
        }
        .composer__input:focus { outline: none; border-color: var(--brand-hover); background: #fff; }
        .composer .icon-btn { width: 44px; height: 44px; border-radius: 50%; }
        [dir="rtl"] #send-btn svg { transform: scaleX(-1); }
    </style>
</head>
<body>
<div class="app">

    <header class="app-header">
        <div class="app-header__title">
            <div id="convo-avatar"><span class="avatar avatar--sm community-avatar" data-icon="users"></span></div>
            <div class="min-w-0">
                <h1 id="chat-title">הצ'אט הקהילתי</h1>
                <p id="chat-subtitle">כל משתמשי Ping</p>
            </div>
        </div>
        <div class="app-header__actions">
            <button type="button" id="streak-btn" class="streak-chip hidden" onclick="openStreakSheet()"></button>
            <a href="shop.html" id="points-chip" class="points-chip hidden" title="הנקודות שלך">
                <span class="coin">P</span><span data-points>0</span>
            </a>
            <button id="open-add-friend-btn" type="button" class="icon-btn hidden" onclick="openAddFriend()" aria-label="הוספת חבר" data-icon="userPlus"></button>
            <a href="auth.html" id="login-btn" class="btn btn-primary btn-sm hidden">התחברות</a>
        </div>
    </header>

    <!-- Conversations -->
    <div id="convo-strip" class="convo-strip scroll-x" role="tablist" aria-label="שיחות">
        <button type="button" class="convo" data-convo="community" aria-current="true" role="tab">
            <span class="convo__ring"><span class="avatar avatar--lg community-avatar" data-icon="users"></span></span>
            <span class="convo__label">קהילה</span>
        </button>
        <div id="friends-circles" class="contents">
            <div class="flex items-center gap-3">
                <div class="skeleton w-[52px] h-[52px] !rounded-full"></div>
                <div class="skeleton w-[52px] h-[52px] !rounded-full"></div>
            </div>
        </div>
    </div>

    <!-- Friend requests (shown only when there are incoming requests) -->
    <section id="requests-panel" class="requests hidden" aria-label="בקשות חברות">
        <button type="button" id="requests-toggle" class="requests__head" aria-expanded="true" aria-controls="requests-list">
            <span class="requests__icon" data-icon="userPlus"></span>
            <span class="flex-1 text-start">בקשות חברות</span>
            <span id="requests-count" class="requests__count">0</span>
            <svg class="requests__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="requests-list" class="requests__list"></div>
    </section>

    <!-- Messages -->
    <main class="flex-1 relative overflow-hidden flex flex-col">
        <div id="chat-scroll" class="flex-1 overflow-y-auto" aria-live="polite">
            <div id="chat-messages" class="messages">
                <div class="empty mt-10"><div class="spinner"></div></div>
            </div>
        </div>
        <button id="jump-btn" type="button" class="jump-btn" onclick="scrollToBottom(true)">
            <span>הודעות חדשות</span><span aria-hidden="true">↓</span>
        </button>
    </main>

    <!-- Composer -->
    <div class="composer">
        <form id="chat-form" onsubmit="sendMessage(event)" class="hidden">
            <button type="button" id="attach-btn" class="icon-btn" onclick="PingUI.openModal('attach-sheet')" aria-label="תמונה, נקודות ומתנות" data-icon="plus"></button>
            <textarea id="message-input" class="composer__input" rows="1" placeholder="כתבו הודעה..." autocomplete="off" aria-label="הודעה" maxlength="2000"></textarea>
            <button id="send-btn" type="submit" class="icon-btn icon-btn--brand" aria-label="שליחה" disabled data-icon="send"></button>
            <input id="image-input" type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
        </form>
        <div id="guest-composer" class="flex items-center justify-between gap-3 max-w-[760px] mx-auto py-1">
            <span class="text-sm text-ink-2">התחברו כדי להצטרף לשיחה</span>
            <a href="auth.html" class="btn btn-primary btn-sm">התחברות</a>
        </div>
    </div>

    <nav data-ping-nav="chat"></nav>
</div>

    <!-- Sheet: attachments -->
    <div id="attach-sheet" class="modal" role="dialog" aria-modal="true" aria-label="שליחת תוכן">
        <div class="modal__panel">
            <div class="modal__grabber"></div>
            <div class="list !border-0 !rounded-2xl">
                <button type="button" class="list-row" onclick="PingUI.closeModal('attach-sheet'); document.getElementById('image-input').click()">
                    <span class="list-row__icon !bg-sky-100 !text-sky-700" data-icon="image"></span>
                    <span class="list-row__body"><span class="list-row__title block">תמונה</span><span class="list-row__sub block">שליחת תמונה מהמכשיר</span></span>
                </button>
                <button type="button" id="gift-row" class="list-row" onclick="PingUI.closeModal('attach-sheet'); openAmountModal('gift')">
                    <span class="list-row__icon !bg-rose-100 !text-rose-600" data-icon="gift"></span>
                    <span class="list-row__body"><span class="list-row__title block">מתנת נקודות</span><span id="gift-row-sub" class="list-row__sub block">החבר יקבל את הנקודות אחרי שיאשר</span></span>
                </button>
            </div>
            <button type="button" class="btn btn-soft btn-block mt-3" data-close-modal>ביטול</button>
        </div>
    </div>

    <!-- Sheet: chat streak -->
    <div id="streak-sheet" class="modal" role="dialog" aria-modal="true" aria-label="רצף צ'אט">
        <div class="modal__panel">
            <div class="modal__grabber"></div>
            <div class="modal__head">
                <h3 class="modal__title">רצף צ'אט</h3>
                <button type="button" class="icon-btn icon-btn--plain" data-close-modal aria-label="סגירה" data-icon="x"></button>
            </div>
            <div id="streak-sheet-body"></div>
        </div>
    </div>

    <!-- Modal: Add friend -->
    <div id="add-friend-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="add-friend-title">
        <form class="modal__panel" onsubmit="addFriendByUsername(event)" novalidate>
            <div class="modal__grabber"></div>
            <div class="modal__head">
                <h3 id="add-friend-title" class="modal__title">בקשת חברות</h3>
                <button type="button" class="icon-btn icon-btn--plain" data-close-modal aria-label="סגירה" data-icon="x"></button>
            </div>
            <div class="field">
                <label class="field-label" for="friend-username-input">שם המשתמש של החבר</label>
                <div class="input-group" dir="ltr">
                    <span class="input-group__prefix">@</span>
                    <input id="friend-username-input" class="input" type="text" placeholder="username" autocapitalize="off" spellcheck="false" autocomplete="off">
                </div>
                <p id="friend-search-error" class="field-error hidden" role="alert"></p>
                <p class="field-hint">החבר יקבל בקשה ויצטרך לאשר אותה.</p>
            </div>
            <button id="add-friend-submit" type="submit" class="btn btn-primary btn-lg btn-block mt-5"><span>שליחת בקשה</span></button>
            <div id="outgoing-wrap" class="hidden mt-5">
                <div class="text-xs font-bold text-ink-muted mb-2">בקשות שנשלחו וממתינות</div>
                <div id="outgoing-list" class="space-y-2"></div>
            </div>
        </form>
    </div>

    <!-- Modal: Send points / gift (shared) -->
    <div id="amount-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="amount-title">
        <form class="modal__panel" onsubmit="submitAmount(event)" novalidate>
            <div class="modal__grabber"></div>
            <div class="modal__head">
                <h3 id="amount-title" class="modal__title">פרגון בנקודות</h3>
                <button type="button" class="icon-btn icon-btn--plain" data-close-modal aria-label="סגירה" data-icon="x"></button>
            </div>
            <p id="amount-desc" class="modal__text mb-4"></p>
            <div class="amount-options mb-3" id="amount-options">
                <button type="button" class="amount-option" data-amount="5">5</button>
                <button type="button" class="amount-option" data-amount="10" aria-pressed="true">10</button>
                <button type="button" class="amount-option" data-amount="25">25</button>
                <button type="button" class="amount-option" data-amount="50">50</button>
            </div>
            <div class="field">
                <label class="field-label" for="amount-input">או סכום אחר</label>
                <input id="amount-input" class="input" type="number" inputmode="numeric" min="1" max="1000" value="10">
                <p class="field-hint">יתרה זמינה: <b class="text-ink" id="available-points">0</b> נקודות</p>
                <p id="amount-error" class="field-error hidden" role="alert"></p>
            </div>
            <button id="amount-submit" type="submit" class="btn btn-primary btn-lg btn-block mt-5"><span id="amount-submit-text">שליחה</span></button>
        </form>
    </div>

    <!-- Sheet: message actions -->
    <div id="msg-menu" class="modal" role="dialog" aria-modal="true" aria-label="אפשרויות הודעה">
        <div class="modal__panel">
            <div class="modal__grabber"></div>
            <div class="list !border-0 !rounded-2xl">
                <button type="button" id="msg-copy-row" class="list-row" onclick="copyMessage()">
                    <span class="list-row__icon" data-icon="edit"></span>
                    <span class="list-row__body"><span class="list-row__title block">העתקת הטקסט</span></span>
                </button>
                <button type="button" id="msg-delete-row" class="list-row text-rose-600" onclick="deleteMessage()">
                    <span class="list-row__icon !bg-rose-50 !text-rose-600" data-icon="trash"></span>
                    <span class="list-row__body"><span class="list-row__title block">מחיקת ההודעה</span><span class="list-row__sub block">תימחק לכולם בשיחה</span></span>
                </button>
            </div>
            <p id="msg-menu-note" class="text-xs text-ink-muted text-center mt-3 hidden">אי אפשר למחוק הודעות של נקודות ומתנות</p>
            <button type="button" class="btn btn-soft btn-block mt-3" data-close-modal>ביטול</button>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="modal !items-center !p-4" role="dialog" aria-modal="true" aria-label="תמונה">
        <img id="lightbox-img" src="" alt="" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl" data-close-modal>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, getDocs, query, where, addDoc, orderBy, limit, onSnapshot, serverTimestamp, updateDoc, increment, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import * as firestoreAll from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB_qQYXimsvfpHx2Ewub5zgNC2169Da7CM",
            authDomain: "ping-35cba.firebaseapp.com",
            projectId: "ping-35cba",
            storageBucket: "ping-35cba.firebasestorage.app",
            messagingSenderId: "73779940449",
            appId: "1:73779940449:web:281f72743f38a0a6816e20",
            measurementId: "G-KVVDK019JN"
        };

        const app = initializeApp(firebaseConfig);
        getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Friend requests: list + in-app popup with accept/decline, on every page
        onAuthStateChanged(auth, (u) => { if (u) PingUI.startSocial(db, firestoreAll, u); });

        const MESSAGE_LIMIT = 150;
        const $ = (id) => document.getElementById(id);
        const esc = PingUI.escapeHtml;

        let currentUser = null;
        let userData = null;
        let userUnsub = null;
        let currentConversationId = 'community';
        let currentFriend = null;
        let messagesUnsub = null;
        let friendsKey = '';
        let renderedIds = new Set();
        let firstRender = true;
        const unreadCounts = {};
        const unreadUnsubs = {};
        const streakUnsubs = {};
        const streaks = {};   // convoId -> streak object

        const params = new URLSearchParams(location.search);

        const convoIdFor = (uid) => [currentUser.uid, uid].sort().join('_');

        /* ---------------- Auth ---------------- */
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (userUnsub) { userUnsub(); userUnsub = null; }

            if (!user) {
                userData = null;
                $('chat-form').classList.add('hidden');
                $('guest-composer').classList.remove('hidden');
                $('login-btn').classList.remove('hidden');
                $('open-add-friend-btn').classList.add('hidden');
                $('points-chip').classList.add('hidden');
                $('friends-circles').innerHTML = '';
                $('chat-messages').innerHTML = emptyState('chat', 'הצטרפו לשיחה', 'התחברו כדי לקרוא ולשלוח הודעות לקהילה ולחברים.');
                return;
            }

            let initialized = false;
            userUnsub = onSnapshot(doc(db, "users", user.uid), (snap) => {
                if (!snap.exists() || !snap.data().username) {
                    window.location.replace('auth.html');
                    return;
                }
                userData = snap.data();
                PingUI.setPoints(userData.points ?? 0);
                $('available-points').textContent = PingUI.formatNumber(userData.points ?? 0);

                const friends = userData.friends || [];
                const key = friends.map(f => f.uid).join(',');
                if (key !== friendsKey) {
                    friendsKey = key;
                    renderFriendsCircles();
                    listenForUnread(friends);
                }

                if (!initialized) {
                    initialized = true;
                    $('chat-form').classList.remove('hidden');
                    $('guest-composer').classList.add('hidden');
                    $('login-btn').classList.add('hidden');
                    $('open-add-friend-btn').classList.remove('hidden');
                    $('points-chip').classList.remove('hidden');

                    const withUid = params.get('with');
                    const friend = withUid && friends.find(f => f.uid === withUid);
                    if (friend) openPrivateChat(friend.uid); else openCommunityChat();
                    if (params.get('add')) openAddFriend();
                }
            });
        });

        /* ---------------- Conversations strip ---------------- */
        function renderFriendsCircles() {
            const friends = userData?.friends || [];
            const container = $('friends-circles');
            let html = friends.map(friend => {
                const unread = unreadCounts[convoIdFor(friend.uid)] || 0;
                const active = currentConversationId === convoIdFor(friend.uid);
                const st = streakFor(friend.uid);
                const streakBadge = st.count > 0
                    ? `<span class="convo__streak ${st.state === 'atRisk' ? 'is-risk' : ''}">${st.state === 'atRisk' ? '⏳' : '🔥'}${st.count}</span>`
                    : '';
                return `
                    <button type="button" class="convo" role="tab" data-convo="${esc(friend.uid)}" aria-current="${active}">
                        <span class="convo__ring">
                            ${PingUI.avatarHTML({ ...PingUI.liveProfile(friend.uid, friend), size: 'lg' })}
                            ${unread ? `<span class="convo__badge">${unread > 9 ? '9+' : unread}</span>` : ''}
                            ${streakBadge}
                        </span>
                        <span class="convo__label">${PingUI.nameHTML(PingUI.liveProfile(friend.uid, friend))}</span>
                    </button>`;
            }).join('');

            html += `
                <button type="button" class="convo convo--add" onclick="openAddFriend()">
                    <span class="convo__ring"><span class="avatar avatar--lg">${PingUI.icon('plus')}</span></span>
                    <span class="convo__label">${friends.length ? 'הוספה' : 'הוסיפו חבר'}</span>
                </button>`;
            container.innerHTML = html;
        }

        $('convo-strip').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-convo]');
            if (!btn || !currentUser) return;
            const id = btn.dataset.convo;
            if (id === 'community') openCommunityChat(); else openPrivateChat(id);
        });

        function setActiveConvo() {
            document.querySelectorAll('.convo[data-convo]').forEach(el => {
                const id = el.dataset.convo;
                const isActive = id === 'community'
                    ? currentConversationId === 'community'
                    : currentConversationId === convoIdFor(id);
                el.setAttribute('aria-current', String(isActive));
            });
        }

        // Count new incoming messages in conversations that aren't open
        function listenForUnread(friends) {
            const wanted = new Set(friends.map(f => f.uid));
            Object.keys(unreadUnsubs).forEach(uid => {
                if (!wanted.has(uid)) { unreadUnsubs[uid](); delete unreadUnsubs[uid]; }
            });
            Object.keys(streakUnsubs).forEach(uid => {
                if (!wanted.has(uid)) { streakUnsubs[uid](); delete streakUnsubs[uid]; }
            });
            friends.forEach(friend => {
                if (unreadUnsubs[friend.uid]) return;
                const convoId = convoIdFor(friend.uid);

                // Streak state lives on the conversation document
                streakUnsubs[friend.uid] = onSnapshot(doc(db, "conversations", convoId), (snap) => {
                    streaks[convoId] = snap.exists() ? snap.data().streak || null : null;
                    renderFriendsCircles();
                    if (currentConversationId === convoId) renderStreakChip();
                    maybeClaimStreak(convoId, friend);
                }, (err) => console.warn("Streak listener error:", err));

                const q = query(collection(db, "conversations", convoId, "messages"), orderBy("createdAt", "desc"), limit(1));
                let first = true;
                unreadUnsubs[friend.uid] = onSnapshot(q, (snapshot) => {
                    if (first) { first = false; return; } // ignore history on load
                    snapshot.docChanges().forEach(change => {
                        if (change.type !== 'added') return;
                        const msg = change.doc.data();
                        if (msg.uid === currentUser.uid || convoId === currentConversationId) return;
                        unreadCounts[convoId] = (unreadCounts[convoId] || 0) + 1;
                        renderFriendsCircles();
                        PingUI.toast(`הודעה חדשה מ${friend.displayName || friend.username}`, {
                            action: { label: 'פתיחה', onClick: () => openPrivateChat(friend.uid) }
                        });
                    });
                }, (err) => console.error("Unread listener error:", err));
            });
        }

        window.openCommunityChat = function() {
            currentConversationId = 'community';
            currentFriend = null;
            $('chat-title').textContent = "הצ'אט הקהילתי";
            $('chat-subtitle').textContent = 'כל משתמשי Ping';
            $('convo-avatar').innerHTML = `<span class="avatar avatar--sm community-avatar">${PingUI.icon('users')}</span>`;
            $('message-input').placeholder = 'כתבו לקהילה...';
            renderStreakChip();
            updateGiftRow();
            setActiveConvo();
            history.replaceState(null, '', 'chat.html');
            loadMessages('community');
        };

        window.openPrivateChat = function(friendUid) {
            const friend = (userData?.friends || []).find(f => f.uid === friendUid);
            if (!friend) return;
            currentFriend = friend;
            currentConversationId = convoIdFor(friendUid);
            unreadCounts[currentConversationId] = 0;
            const name = PingUI.liveProfile(friend.uid, friend).name;
            renderChatHeader();
            $('message-input').placeholder = `הודעה ל${name}...`;
            renderStreakChip();
            updateGiftRow();
            renderFriendsCircles();
            history.replaceState(null, '', `chat.html?with=${encodeURIComponent(friendUid)}`);
            loadMessages(currentConversationId);
        };

        function updateGiftRow() {
            const row = $('gift-row');
            const isPrivate = currentConversationId !== 'community';
            row.disabled = !isPrivate;
            row.style.opacity = isPrivate ? '' : '.5';
            $('gift-row-sub').textContent = isPrivate
                ? `${currentFriend?.displayName || 'החבר'} יקבל/תקבל את הנקודות אחרי אישור`
                : 'זמין רק בשיחה פרטית עם חבר';
        }

        /* ---------------- Messages ---------------- */
        function emptyState(iconName, title, text) {
            return `<div class="empty mt-10 fade-in">
                <div class="empty__icon">${PingUI.icon(iconName)}</div>
                <div class="empty__title">${esc(title)}</div>
                <div class="empty__text">${esc(text)}</div>
            </div>`;
        }

        function loadMessages(conversationId) {
            if (messagesUnsub) messagesUnsub();
            renderedIds = new Set();
            msgIndex = {};
            lastDocs = null;
            firstRender = true;
            $('jump-btn').classList.remove('is-visible');

            const container = $('chat-messages');
            container.innerHTML = '<div class="empty mt-10"><div class="spinner"></div></div>';

            const q = query(collection(db, "conversations", conversationId, "messages"), orderBy("createdAt", "desc"), limit(MESSAGE_LIMIT));
            messagesUnsub = onSnapshot(q, (snapshot) => {
                if (conversationId !== currentConversationId) return;
                const docs = snapshot.docs.slice().reverse();

                if (docs.length === 0) {
                    container.innerHTML = conversationId === 'community'
                        ? emptyState('chat', 'עדיין שקט כאן', 'היו הראשונים לכתוב משהו לקהילה!')
                        : emptyState('chat', `תגידו שלום ל${currentFriend?.displayName || 'חבר'}`, 'זו תחילת השיחה הפרטית שלכם.');
                    return;
                }

                const scroller = $('chat-scroll');
                const nearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140;
                const lastIsMine = docs[docs.length - 1].data().uid === currentUser?.uid;

                lastDocs = docs;
                container.innerHTML = renderMessages(docs);
                if (conversationId !== 'community') claimGiftRefunds(conversationId, docs);

                if (firstRender || nearBottom || lastIsMine) {
                    scrollToBottom(!firstRender);
                } else {
                    $('jump-btn').classList.add('is-visible');
                }
                firstRender = false;
            }, (err) => {
                console.error("Messages error:", err);
                container.innerHTML = emptyState('alert', 'לא הצלחנו לטעון הודעות', 'בדקו את החיבור ונסו שוב.');
            });
        }

        const dayKey = (d) => d ? `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` : 'pending';
        function dayLabel(d) {
            const today = new Date();
            const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
            if (dayKey(d) === dayKey(today)) return 'היום';
            if (dayKey(d) === dayKey(yesterday)) return 'אתמול';
            return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: d.getFullYear() !== today.getFullYear() ? 'numeric' : undefined });
        }
        const timeLabel = (d) => d ? d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : 'שולח…';

        function renderMessages(docs) {
            let html = '';
            let prev = null;
            let lastDay = null;

            docs.forEach((docSnap) => {
                const msg = docSnap.data();
                const date = msg.createdAt?.toDate ? msg.createdAt.toDate() : null;
                const isMe = currentUser && msg.uid === currentUser.uid;
                const dk = date ? dayKey(date) : lastDay;

                if (date && dk !== lastDay) {
                    html += `<div class="day-sep">${dayLabel(date)}</div>`;
                    lastDay = dk;
                    prev = null;
                }

                const groupStart = !prev || prev.uid !== msg.uid || (date && prev.date && date - prev.date > 5 * 60 * 1000);
                const isNew = !renderedIds.has(docSnap.id) && !firstRender;
                renderedIds.add(docSnap.id);

                const sender = PingUI.liveProfile(msg.uid, msg);
                const showMeta = !isMe && groupStart && currentConversationId === 'community';
                const nameHTML = showMeta
                    ? `<div class="msg-name">${PingUI.nameHTML(sender)}<small dir="ltr">@${esc(sender.username)}</small></div>`
                    : '';
                // Own messages show your current photo and frame; others show the sender's
                const avatarHTML = !groupStart ? '' : isMe
                    ? PingUI.avatarHTML({ ...sender, size: 'sm' })
                    : PingUI.avatarHTML({ ...sender, size: 'sm' });
                msgIndex[docSnap.id] = { mine: isMe, type: msg.type || 'text', text: msg.text || '' };

                html += `
                    <div class="msg-row ${isMe ? 'msg-row--me' : ''} ${groupStart ? 'group-start' : ''} ${isNew ? 'msg-new' : ''}" data-msg-id="${esc(docSnap.id)}">
                        <div class="msg-avatar-slot">${avatarHTML}</div>
                        <div class="msg-col">
                            ${nameHTML}
                            ${bubbleHTML(docSnap.id, msg, isMe, date)}
                        </div>
                        <button type="button" class="msg-more" data-msg-menu="${esc(docSnap.id)}" aria-label="אפשרויות הודעה">⋯</button>
                    </div>`;
                prev = { uid: msg.uid, date };
            });
            return html;
        }

        function bubbleHTML(id, msg, isMe, date) {
            const meta = `<span class="bubble__meta">${timeLabel(date)}</span>`;

            if (msg.type === 'image') {
                const src = PingUI.safeUrl(msg.imageUrl);
                return `<div class="bubble bubble--media"><img src="${src}" alt="תמונה ששותפה בצ'אט" loading="lazy" data-full="${src}">${meta}</div>`;
            }

            if (msg.type === 'points') {
                return `<div class="bubble bubble--special">
                    <div class="special-head"><span class="special-icon">${PingUI.icon('coin')}</span>
                    <span>${isMe ? 'פרגנת' : 'פרגן/ה'} ב-${PingUI.formatNumber(msg.points)} נקודות 🎉</span></div>${meta}</div>`;
            }

            if (msg.type === 'gift') {
                const forMe = currentUser && msg.toUid === currentUser.uid;
                const pts = PingUI.formatNumber(msg.points);
                if (forMe && !msg.accepted && !msg.declined) {
                    return `<div class="bubble bubble--special">
                        <div class="special-head"><span class="special-icon">${PingUI.icon('gift')}</span>
                        <span>מתנה של ${pts} נקודות בשבילך!</span></div>
                        <div class="gift-actions">
                            <button type="button" class="btn btn-soft btn-sm" data-gift-decline="${esc(id)}"><span class="inline-flex items-center gap-1">${PingUI.icon('x')}<span>דחייה</span></span></button>
                            <button type="button" class="btn btn-dark btn-sm" data-gift-accept="${esc(id)}"><span class="inline-flex items-center gap-1">${PingUI.icon('check')}<span>אישור</span></span></button>
                        </div>${meta}</div>`;
                }
                if (msg.declined) {
                    const who = isMe ? (msg.refunded ? 'נדחתה · הנקודות חזרו אליך' : 'נדחתה') : 'נדחתה';
                    return `<div class="bubble bubble--gift-declined">
                        <div class="special-head"><span class="special-icon">${PingUI.icon('gift')}</span>
                        <span>מתנה של ${pts} נקודות · <span class="font-medium">${who}</span></span></div>${meta}</div>`;
                }
                const status = msg.accepted ? 'התקבלה ✓' : 'ממתינה לאישור';
                return `<div class="bubble bubble--gift-done">
                    <div class="special-head"><span class="special-icon">${PingUI.icon('gift')}</span>
                    <span>מתנה של ${pts} נקודות · <span class="font-medium">${status}</span></span></div>${meta}</div>`;
            }

            return `<div class="bubble ${isMe ? 'bubble--me' : 'bubble--them'}">${esc(msg.text)}${meta}</div>`;
        }

        /* ---------------- Message actions (long-press / right-click / ⋯) ---------------- */
        let msgIndex = {};       // id -> { mine, type, text } for the open conversation
        let menuMsgId = null;
        let pressTimer = null, pressStart = null, lastMenuAt = 0;

        function openMsgMenu(id) {
            const info = msgIndex[id];
            if (!info || Date.now() - lastMenuAt < 400) return;
            const canDelete = info.mine && (info.type === 'text' || info.type === 'image');
            if (info.type !== 'text' && !info.mine) return; // nothing to offer on others' media/gifts
            lastMenuAt = Date.now();
            menuMsgId = id;
            $('msg-copy-row').classList.toggle('hidden', info.type !== 'text');
            $('msg-delete-row').classList.toggle('hidden', !canDelete);
            $('msg-menu-note').classList.toggle('hidden', !(info.mine && !canDelete));
            if (navigator.vibrate) navigator.vibrate(12);
            document.querySelector(`.msg-row[data-msg-id="${CSS.escape(id)}"]`)?.classList.add('is-pressed');
            PingUI.openModal('msg-menu');
        }

        $('msg-menu').addEventListener('modal:close', () => {
            document.querySelectorAll('.msg-row.is-pressed').forEach(r => r.classList.remove('is-pressed'));
        });

        const msgsEl = $('chat-messages');
        msgsEl.addEventListener('pointerdown', (e) => {
            const bubble = e.target.closest('.bubble');
            if (!bubble || e.target.closest('button')) return;
            const id = bubble.closest('.msg-row')?.dataset.msgId;
            pressStart = { x: e.clientX, y: e.clientY };
            clearTimeout(pressTimer);
            pressTimer = setTimeout(() => openMsgMenu(id), 450);
        });
        msgsEl.addEventListener('pointermove', (e) => {
            if (pressStart && Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > 10) clearTimeout(pressTimer);
        });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => msgsEl.addEventListener(t, () => clearTimeout(pressTimer)));
        $('chat-scroll').addEventListener('scroll', () => clearTimeout(pressTimer), { passive: true });
        msgsEl.addEventListener('contextmenu', (e) => {
            const row = e.target.closest('.msg-row');
            if (!row) return;
            e.preventDefault();
            openMsgMenu(row.dataset.msgId);
        });

        window.copyMessage = async function() {
            const info = msgIndex[menuMsgId];
            PingUI.closeModal('msg-menu');
            try {
                await navigator.clipboard.writeText(info?.text || '');
                PingUI.toast('ההודעה הועתקה', { type: 'success', duration: 1800 });
            } catch (e) {
                PingUI.toast('לא הצלחנו להעתיק', { type: 'error' });
            }
        };

        window.deleteMessage = async function() {
            const id = menuMsgId;
            const convoId = currentConversationId;
            PingUI.closeModal('msg-menu');
            const ok = await PingUI.confirm({
                title: 'למחוק את ההודעה?', message: 'ההודעה תימחק לכולם בשיחה.',
                confirmText: 'מחיקה', tone: 'danger', iconName: 'trash'
            });
            if (!ok) return;
            const row = document.querySelector(`.msg-row[data-msg-id="${CSS.escape(id)}"]`);
            row?.classList.add('msg-deleting');
            try {
                await deleteDoc(doc(db, "conversations", convoId, "messages", id));
            } catch (error) {
                console.error("Delete message failed:", error);
                row?.classList.remove('msg-deleting');
                PingUI.toast('המחיקה נכשלה, נסו שוב', { type: 'error' });
            }
        };

        // Gift buttons & image lightbox (event delegation)
        $('chat-messages').addEventListener('click', (e) => {
            const more = e.target.closest('[data-msg-menu]');
            if (more) { openMsgMenu(more.dataset.msgMenu); return; }
            const acceptBtn = e.target.closest('[data-gift-accept]');
            if (acceptBtn) { respondToGift(acceptBtn.dataset.giftAccept, true, acceptBtn); return; }
            const declineBtn = e.target.closest('[data-gift-decline]');
            if (declineBtn) { respondToGift(declineBtn.dataset.giftDecline, false, declineBtn); return; }
            const img = e.target.closest('img[data-full]');
            if (img) {
                $('lightbox-img').src = img.dataset.full;
                PingUI.openModal('lightbox');
            }
        });

        // Keep pinned to bottom while images load
        $('chat-messages').addEventListener('load', (e) => {
            if (e.target.tagName !== 'IMG') return;
            const s = $('chat-scroll');
            if (s.scrollHeight - s.scrollTop - s.clientHeight < 400) s.scrollTop = s.scrollHeight;
        }, true);

        window.scrollToBottom = function(smooth) {
            const s = $('chat-scroll');
            s.scrollTo({ top: s.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
            $('jump-btn').classList.remove('is-visible');
        };

        $('chat-scroll').addEventListener('scroll', () => {
            const s = $('chat-scroll');
            if (s.scrollHeight - s.scrollTop - s.clientHeight < 80) $('jump-btn').classList.remove('is-visible');
        });

        /* ---------------- Composer ---------------- */
        const input = $('message-input');
        function autosize() {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 140) + 'px';
            $('send-btn').disabled = !input.value.trim();
        }
        input.addEventListener('input', autosize);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                $('chat-form').requestSubmit();
            }
        });

        function baseMessage() {
            return {
                uid: currentUser.uid,
                name: userData.displayName || userData.username,
                username: userData.username,
                photoURL: userData.photoURL || currentUser.photoURL || '',
                frame: userData.activeFrame || '',
                gradient: userData.activeGradient || '',
                createdAt: serverTimestamp()
            };
        }

        window.sendMessage = async function(event) {
            event.preventDefault();
            if (!currentUser || !userData) return;
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            autosize();
            input.focus();
            const convoId = currentConversationId;
            const friend = currentFriend;
            try {
                await addDoc(collection(db, "conversations", convoId, "messages"), { ...baseMessage(), type: 'text', text });
                recordStreak(convoId, friend);
            } catch (error) {
                console.error("שגיאה בשליחת הודעה:", error);
                input.value = text;
                autosize();
                PingUI.toast('ההודעה לא נשלחה, נסו שוב', { type: 'error' });
            }
        };

        window.handleImageUpload = async function(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file || !currentUser) return;

            const convoId = currentConversationId;
            const friend = currentFriend;
            const dismiss = PingUI.toast('מעלה תמונה...', { duration: 60000 });
            PingUI.setLoading($('attach-btn'), true);
            try {
                const imageUrl = await PingUI.uploadImage(file, 'chat');
                await addDoc(collection(db, "conversations", convoId, "messages"), { ...baseMessage(), type: 'image', imageUrl });
                dismiss();
                recordStreak(convoId, friend);
            } catch (error) {
                console.error("שגיאה בשליחת תמונה:", error);
                dismiss();
                PingUI.toast(PingUI.uploadErrorMessage(error), { type: 'error' });
            } finally {
                PingUI.setLoading($('attach-btn'), false);
            }
        };

        /* ---------------- Streaks ---------------- */
        function streakFor(friendUid) {
            return PingUI.streakStatus(streaks[convoIdFor(friendUid)], currentUser.uid, friendUid);
        }

        // Called after every message sent in a private chat
        async function recordStreak(convoId, friend) {
            if (convoId === 'community' || !friend) return;
            const me = currentUser.uid;
            const today = PingUI.dayKey();
            const ref = doc(db, "conversations", convoId);
            try {
                const completedCount = await runTransaction(db, async (tx) => {
                    const snap = await tx.get(ref);
                    const cur = snap.exists() ? snap.data().streak : null;
                    if (cur?.lastSent?.[me] === today) return 0; // already counted today
                    const { streak, completed } = PingUI.streakApplySend(cur, me, friend.uid, today);
                    tx.set(ref, { members: [me, friend.uid].sort(), streak }, { merge: true });
                    return completed ? streak.count : 0;
                });
                if (completedCount) {
                    const left = PingUI.STREAK.REWARD_EVERY - (completedCount % PingUI.STREAK.REWARD_EVERY);
                    PingUI.toast(`🔥 ${completedCount} ימי רצף עם ${friend.displayName || friend.username}` +
                        (left < PingUI.STREAK.REWARD_EVERY ? ` · עוד ${left} לבונוס` : ''), { type: 'success' });
                }
            } catch (error) {
                console.warn("Streak update failed:", error);
            }
        }

        // Each friend claims their own milestone bonus (100 points per 10 days)
        const claiming = new Set();
        async function maybeClaimStreak(convoId, friend) {
            const st = PingUI.streakStatus(streaks[convoId], currentUser.uid, friend.uid);
            if (!st.claimable || claiming.has(convoId)) return;
            claiming.add(convoId);
            const me = currentUser.uid;
            try {
                const points = await runTransaction(db, async (tx) => {
                    const ref = doc(db, "conversations", convoId);
                    const snap = await tx.get(ref);
                    const { streak, points } = PingUI.streakClaim(snap.exists() ? snap.data().streak : null, me);
                    if (!points) return 0;
                    tx.set(ref, { streak: { claimed: { [me]: streak.claimed[me] } } }, { merge: true });
                    tx.update(doc(db, "users", me), { points: increment(points) });
                    return points;
                });
                if (points) {
                    PingUI.toast(`בונוס רצף עם ${friend.displayName || friend.username}! +${points} נקודות`, { type: 'points', duration: 5000 });
                }
            } catch (error) {
                console.warn("Streak claim failed:", error);
            } finally {
                claiming.delete(convoId);
            }
        }

        function renderStreakChip() {
            const btn = $('streak-btn');
            if (!currentFriend) { btn.classList.add('hidden'); return; }
            const st = streakFor(currentFriend.uid);
            btn.classList.remove('hidden');
            btn.dataset.state = st.restore && st.state !== 'active' && st.state !== 'atRisk' ? 'restorable' : st.state;
            btn.innerHTML = `<span aria-hidden="true">${st.state === 'atRisk' ? '⏳' : '🔥'}</span><span>${st.count}</span>${st.restore ? '<span class="streak-chip__dot"></span>' : ''}`;
            btn.setAttribute('aria-label', `רצף צ'אט: ${st.count} ימים`);
            if ($('streak-sheet').classList.contains('is-open')) renderStreakSheet();
        }

        function renderStreakSheet() {
            if (!currentFriend) return;
            const st = streakFor(currentFriend.uid);
            const name = esc(currentFriend.displayName || currentFriend.username);
            const S = PingUI.STREAK;
            const check = (ok, label) => `<div class="flex items-center gap-2 text-sm ${ok ? 'text-emerald-700' : 'text-ink-muted'}">
                <span class="w-5 h-5 rounded-full flex items-center justify-center ${ok ? 'bg-emerald-100' : 'bg-[#F3F0E8]'}">${ok ? PingUI.icon('check').replace('<svg', '<svg width="12" height="12"') : ''}</span>${label}</div>`;

            let statusHTML = '';
            if (st.state === 'active') statusHTML = `<p class="modal__text">מעולה! היום כבר נספר. חזרו מחר כדי להמשיך את הרצף.</p>`;
            else if (st.state === 'atRisk') statusHTML = `<p class="modal__text"><b>הרצף בסכנה!</b> שניכם צריכים לשלוח הודעה היום כדי לשמור עליו.</p>`;
            else statusHTML = `<p class="modal__text">שלחו הודעות שניכם באותו יום כדי להתחיל רצף.</p>`;

            const restoreHTML = st.restore ? `
                <div class="mt-4 rounded-2xl border border-rose-200 bg-rose-50 p-4">
                    <div class="font-bold text-rose-700">הרצף של ${st.restore.count} ימים נשבר</div>
                    <p class="text-sm text-rose-700/80 mt-1">אפשר לשחזר אותו תוך ${S.RESTORE_WINDOW_DAYS} ימים מהשבירה.</p>
                    <button type="button" id="restore-btn" class="btn btn-dark btn-block mt-3" onclick="restoreStreak()">
                        <span class="inline-flex items-center gap-2">${PingUI.icon('restore')}<span>שחזור ב-${S.RESTORE_COST} נקודות</span></span>
                    </button>
                </div>` : '';

            $('streak-sheet-body').innerHTML = `
                <div class="text-center">
                    <div class="streak-hero ${st.count ? '' : 'is-off'}">${st.state === 'atRisk' ? '⏳' : '🔥'}</div>
                    <div class="text-4xl font-black mt-2">${st.count}</div>
                    <div class="text-sm text-ink-muted font-semibold">ימי רצף עם ${name}</div>
                </div>
                <div class="mt-5">
                    <div class="flex justify-between text-xs font-bold text-ink-2 mb-1.5">
                        <span>${st.daysToNext === 1 ? 'עוד יום אחד' : `עוד ${st.daysToNext} ימים`}</span><span>בונוס ${S.REWARD_POINTS} נקודות ביום ${st.nextMilestone}</span>
                    </div>
                    <div class="streak-progress"><span style="width:${Math.round(st.progress * 100)}%"></span></div>
                </div>
                <div class="mt-5 space-y-2">${statusHTML}
                    <div class="flex gap-5 pt-1">${check(st.meToday, 'שלחתם היום')}${check(st.otherToday, `${name} שלח/ה היום`)}</div>
                </div>
                ${restoreHTML}
                <p class="text-xs text-ink-muted mt-5 leading-relaxed">יום נספר כששניכם שולחים לפחות הודעה אחת באותו יום. כל ${S.REWARD_EVERY} ימי רצף — ${S.REWARD_POINTS} נקודות לכל אחד מכם.</p>`;
        }

        window.openStreakSheet = function() {
            renderStreakSheet();
            PingUI.openModal('streak-sheet');
        };

        window.restoreStreak = async function() {
            if (!currentFriend) return;
            const convoId = currentConversationId;
            const btn = $('restore-btn');
            const S = PingUI.STREAK;
            const ok = await PingUI.confirm({
                title: 'לשחזר את הרצף?',
                message: `${S.RESTORE_COST} נקודות ירדו מהיתרה שלכם והרצף יחזור לחיים.`,
                confirmText: `שחזור · ${S.RESTORE_COST}`,
                iconName: 'restore'
            });
            if (!ok) return;
            PingUI.setLoading(btn, true);
            try {
                const restored = await runTransaction(db, async (tx) => {
                    const ref = doc(db, "conversations", convoId);
                    const uref = doc(db, "users", currentUser.uid);
                    const snap = await tx.get(ref);
                    const usnap = await tx.get(uref);
                    const next = PingUI.streakApplyRestore(snap.exists() ? snap.data().streak : null);
                    if (!next) throw new Error('not-restorable');
                    const balance = usnap.data().points ?? 120;
                    if (balance < S.RESTORE_COST) throw new Error('insufficient');
                    tx.set(ref, { streak: next }, { merge: true });
                    tx.update(uref, { points: balance - S.RESTORE_COST });
                    return next.count;
                });
                PingUI.toast(`🔥 הרצף שוחזר: ${restored} ימים`, { type: 'success' });
            } catch (error) {
                console.error("Streak restore failed:", error);
                const msg = error.message === 'insufficient' ? `צריך ${S.RESTORE_COST} נקודות כדי לשחזר`
                    : error.message === 'not-restorable' ? 'אי אפשר לשחזר את הרצף הזה יותר' : 'השחזור נכשל, נסו שוב';
                PingUI.toast(msg, { type: 'error' });
            } finally {
                if (document.contains(btn)) PingUI.setLoading(btn, false);
            }
        };

        /* ---------------- Points & gifts ---------------- */
        const amountInput = $('amount-input');
        $('amount-options').addEventListener('click', (e) => {
            const opt = e.target.closest('[data-amount]');
            if (!opt) return;
            amountInput.value = opt.dataset.amount;
            syncAmountOptions();
        });
        amountInput.addEventListener('input', syncAmountOptions);
        function syncAmountOptions() {
            $('amount-error').classList.add('hidden');
            document.querySelectorAll('#amount-options [data-amount]').forEach(b => {
                b.setAttribute('aria-pressed', String(b.dataset.amount === amountInput.value));
            });
        }

        window.openAmountModal = function() {
            if (currentConversationId === 'community' || !currentFriend) return;
            const friendName = currentFriend.displayName || currentFriend.username || '';
            $('amount-title').textContent = `מתנה ל${friendName}`;
            $('amount-desc').textContent = 'הנקודות ירדו מהיתרה שלכם עכשיו. אם החבר יאשר הן יעברו אליו, ואם ידחה הן יחזרו אליכם.';
            $('amount-submit-text').textContent = 'שליחת המתנה';
            $('available-points').textContent = PingUI.formatNumber(userData?.points ?? 0);
            syncAmountOptions();
            PingUI.openModal('amount-modal');
        };

        window.submitAmount = async function(event) {
            event.preventDefault();
            const amount = parseInt(amountInput.value, 10);
            const available = userData?.points ?? 0;
            const err = $('amount-error');
            const showErr = (m) => { err.textContent = m; err.classList.remove('hidden'); };

            if (!currentFriend || currentConversationId === 'community') return showErr('מתנות אפשר לשלוח רק בשיחה פרטית');
            if (!amount || amount <= 0) return showErr('הזינו מספר נקודות חיובי');
            if (amount > available) return showErr(`אין מספיק נקודות (יש לכם ${available})`);

            const btn = $('amount-submit');
            const convoId = currentConversationId;
            const friend = currentFriend;
            PingUI.setLoading(btn, true);
            try {
                await addDoc(collection(db, "conversations", convoId, "messages"), {
                    ...baseMessage(), type: 'gift', points: amount,
                    toUid: friend.uid, senderName: userData.username,
                    accepted: false, declined: false, refunded: false
                });
                await updateDoc(doc(db, "users", currentUser.uid), { points: increment(-amount) });
                recordStreak(convoId, friend);
                PingUI.closeModal('amount-modal');
                PingUI.toast(`המתנה נשלחה ל${friend.displayName || friend.username}! 🎁`, { type: 'success' });
            } catch (error) {
                console.error("שגיאה בשליחת מתנה:", error);
                PingUI.toast('השליחה נכשלה, נסו שוב', { type: 'error' });
            } finally {
                PingUI.setLoading(btn, false);
            }
        };

        // Recipient accepts (points added to self) or declines (sender's app refunds itself)
        window.respondToGift = async function(messageId, accept, btn) {
            const convoId = currentConversationId;
            const bubble = btn.closest('.bubble');
            bubble?.querySelectorAll('button').forEach(b => b.disabled = true);
            PingUI.setLoading(btn, true);
            try {
                const result = await runTransaction(db, async (tx) => {
                    const msgRef = doc(db, "conversations", convoId, "messages", messageId);
                    const snap = await tx.get(msgRef);
                    if (!snap.exists()) return { state: 'gone' };
                    const m = snap.data();
                    if (m.toUid !== currentUser.uid) return { state: 'gone' };
                    if (m.accepted || m.declined) return { state: 'done' };
                    if (accept) {
                        tx.update(msgRef, { accepted: true, respondedAt: new Date().toISOString() });
                        tx.update(doc(db, "users", currentUser.uid), { points: increment(m.points || 0) });
                    } else {
                        tx.update(msgRef, { declined: true, respondedAt: new Date().toISOString() });
                    }
                    return { state: 'ok', points: m.points || 0 };
                });
                if (result.state === 'ok') {
                    PingUI.toast(accept ? `+${result.points} נקודות נוספו ליתרה שלכם 🎉` : 'המתנה נדחתה, הנקודות יחזרו לשולח',
                        { type: accept ? 'points' : 'info' });
                } else {
                    PingUI.toast(result.state === 'done' ? 'כבר הגבת למתנה הזו' : 'המתנה כבר לא קיימת', { type: 'info' });
                }
            } catch (error) {
                console.error("Gift response failed:", error);
                bubble?.querySelectorAll('button').forEach(b => b.disabled = false);
                PingUI.toast('הפעולה נכשלה, נסו שוב', { type: 'error' });
            } finally {
                if (document.contains(btn)) PingUI.setLoading(btn, false);
            }
        };

        // Sender side: gifts that were declined give the points back (once)
        const refunding = new Set();
        async function claimGiftRefunds(convoId, docs) {
            const mine = docs.filter(d => {
                const m = d.data();
                return m.type === 'gift' && m.uid === currentUser.uid && m.declined && !m.refunded && !refunding.has(d.id);
            });
            for (const d of mine) {
                refunding.add(d.id);
                try {
                    const pts = await runTransaction(db, async (tx) => {
                        const ref = doc(db, "conversations", convoId, "messages", d.id);
                        const snap = await tx.get(ref);
                        const m = snap.exists() ? snap.data() : null;
                        if (!m || m.uid !== currentUser.uid || !m.declined || m.refunded) return 0;
                        tx.update(ref, { refunded: true });
                        tx.update(doc(db, "users", currentUser.uid), { points: increment(m.points || 0) });
                        return m.points || 0;
                    });
                    if (pts) PingUI.toast(`המתנה נדחתה · ${pts} נקודות חזרו אליך`, { type: 'points', duration: 4500 });
                } catch (e) {
                    console.warn('Gift refund failed:', e);
                } finally {
                    refunding.delete(d.id);
                }
            }
        }

        /* ---------------- Add friend ---------------- */
        const friendInput = $('friend-username-input');
        friendInput.addEventListener('input', () => {
            $('friend-search-error').classList.add('hidden');
            friendInput.removeAttribute('aria-invalid');
        });
        $('add-friend-modal').addEventListener('modal:close', () => {
            friendInput.value = '';
            $('friend-search-error').classList.add('hidden');
        });

        window.openAddFriend = function() {
            if (PingUI.isGuestUser(currentUser, userData)) {
                return PingUI.requireGoogle('כדי להוסיף חברים צריך להתחבר עם חשבון Google.');
            }
            PingUI.openModal('add-friend-modal');
        };

        window.addFriendByUsername = async function(event) {
            if (PingUI.isGuestUser(currentUser, userData)) { event.preventDefault(); PingUI.closeModal('add-friend-modal'); return openAddFriend(); }
            event.preventDefault();
            const target = friendInput.value.trim().toLowerCase().replace(/^@/, '');
            const errorEl = $('friend-search-error');
            const showErr = (m) => { errorEl.textContent = m; errorEl.classList.remove('hidden'); friendInput.setAttribute('aria-invalid', 'true'); };

            if (!target) return showErr('הקלידו שם משתמש');
            if (target === userData.username) return showErr('אי אפשר להוסיף את עצמכם 🙂');
            if ((userData.friends || []).some(f => f.username === target)) return showErr('המשתמש כבר ברשימת החברים שלכם');

            const btn = $('add-friend-submit');
            PingUI.setLoading(btn, true);
            try {
                const snapshot = await getDocs(query(collection(db, "users"), where("username", "==", target)));
                if (snapshot.empty) { PingUI.setLoading(btn, false); return showErr('לא מצאנו משתמש בשם הזה'); }

                const friendData = snapshot.docs[0].data();
                if (friendData.isGuest) { PingUI.setLoading(btn, false); return showErr('המשתמש הזה מחובר כאורח ועוד לא חיבר חשבון Google'); }

                const result = await PingUI.sendFriendRequest(userData, friendData);
                PingUI.closeModal('add-friend-modal');
                if (result === 'sent') {
                    PingUI.toast(`בקשת חברות נשלחה ל${friendData.displayName || friendData.username}`, { type: 'success' });
                }
                // 'accepted': they had already sent you a request, so you're friends now (toast shown by PingUI)
            } catch (error) {
                if (error.message === 'already-pending') { PingUI.setLoading(btn, false); return showErr('כבר שלחת בקשה למשתמש הזה, היא ממתינה לאישור'); }
                console.error("שגיאה בשליחת בקשת חברות:", error);
                PingUI.toast('שליחת הבקשה נכשלה, נסו שוב', { type: 'error' });
            } finally {
                PingUI.setLoading(btn, false);
            }
        };

        /* ---------------- Live profiles ---------------- */
        let lastDocs = null;
        function renderChatHeader() {
            if (!currentFriend) return;
            const p = PingUI.liveProfile(currentFriend.uid, currentFriend);
            $('chat-title').innerHTML = PingUI.nameHTML(p);
            $('chat-subtitle').textContent = '@' + p.username;
            $('convo-avatar').innerHTML = PingUI.avatarHTML({ ...p, size: 'sm' });
        }
        // A friend (or anyone in the chat) changed photo, name, frame or gradient
        window.addEventListener('ping:profiles', () => {
            if (!currentUser || !userData) return;
            renderFriendsCircles();
            renderChatHeader();
            if (lastDocs && lastDocs.length) {
                const s = $('chat-scroll');
                const top = s.scrollTop;
                $('chat-messages').innerHTML = renderMessages(lastDocs);
                s.scrollTop = top;
            }
        });

        /* ---------------- Friend requests panel ---------------- */
        function renderRequests({ incoming, outgoing }) {
            const panel = $('requests-panel');
            panel.classList.toggle('hidden', incoming.length === 0);
            $('requests-count').textContent = incoming.length;
            $('requests-list').innerHTML = incoming.map(r => `
                <div class="req-row" data-req="${esc(r.id)}">
                    ${PingUI.avatarHTML({ photoURL: r.fromPhotoURL, name: r.fromDisplayName || r.fromUsername, size: 'md', frame: r.fromFrame })}
                    <div class="req-row__body">
                        <div class="req-row__name">${esc(r.fromDisplayName || r.fromUsername)}</div>
                        <div class="req-row__sub"><span dir="ltr">@${esc(r.fromUsername)}</span> · ${PingUI.timeAgo(r.createdAt?.toDate ? r.createdAt.toDate() : null)}</div>
                    </div>
                    <button type="button" class="req-btn req-btn--no" data-req-act="no" aria-label="דחיית הבקשה">${PingUI.icon('x')}</button>
                    <button type="button" class="req-btn req-btn--yes" data-req-act="yes" aria-label="אישור הבקשה">${PingUI.icon('check')}</button>
                </div>`).join('');

            $('outgoing-wrap').classList.toggle('hidden', outgoing.length === 0);
            $('outgoing-list').innerHTML = outgoing.map(r => `
                <div class="out-row" data-out="${esc(r.id)}">
                    ${PingUI.avatarHTML({ photoURL: r.toPhotoURL, name: r.toDisplayName || r.toUsername, size: 'sm' })}
                    <div class="flex-1 min-w-0 text-sm"><b>${esc(r.toDisplayName || r.toUsername)}</b> <span class="text-ink-muted">· ממתין לאישור</span></div>
                    <button type="button" class="btn btn-ghost btn-sm" data-out-cancel>ביטול</button>
                </div>`).join('');
        }

        window.addEventListener('ping:requests', (e) => renderRequests(e.detail));
        renderRequests(PingUI.getFriendRequests());

        $('requests-toggle').addEventListener('click', () => {
            const t = $('requests-toggle');
            t.setAttribute('aria-expanded', String(t.getAttribute('aria-expanded') !== 'true'));
        });

        $('requests-list').addEventListener('click', async (e) => {
            const b = e.target.closest('[data-req-act]');
            if (!b) return;
            const row = b.closest('[data-req]');
            const req = PingUI.getFriendRequests().incoming.find(r => r.id === row.dataset.req);
            if (!req) return;
            row.querySelectorAll('button').forEach(x => x.disabled = true);
            PingUI.setLoading(b, true);
            const ok = b.dataset.reqAct === 'yes' ? await PingUI.acceptFriendRequest(req) : await PingUI.declineFriendRequest(req);
            if (ok) row.classList.add('is-leaving');
            else { row.querySelectorAll('button').forEach(x => x.disabled = false); PingUI.setLoading(b, false); }
        });

        $('outgoing-list').addEventListener('click', (e) => {
            const b = e.target.closest('[data-out-cancel]');
            if (!b) return;
            const id = b.closest('[data-out]').dataset.out;
            const req = PingUI.getFriendRequests().outgoing.find(r => r.id === id);
            if (req) PingUI.cancelFriendRequest(req);
        });
    </script>
</body>
</html>
